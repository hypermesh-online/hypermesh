name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Related Crate
      options:
        - blockmatrix
        - stoq
        - trustchain
        - catalog
        - caesar
        - caesar-sdk
        - gateway
        - ngauge
        - hypermesh-ebpf
        - hypermesh-lib
        - ui
        - cross-crate
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought about
