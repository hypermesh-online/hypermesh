name: Bug Report
description: Report a bug in HyperMesh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: crate
    attributes:
      label: Affected Crate
      options:
        - blockmatrix
        - stoq
        - trustchain
        - catalog
        - caesar
        - caesar-sdk
        - gateway
        - engauge
        - hypermesh-ebpf
        - hypermesh-lib
        - ui
        - unknown
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash, data loss)
        - High (feature broken)
        - Medium (workaround exists)
        - Low (cosmetic, minor)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "e.g., v0.1.0 or commit hash"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, etc.
      placeholder: |
        OS: Ubuntu 24.04
        Rust: 1.83.0
