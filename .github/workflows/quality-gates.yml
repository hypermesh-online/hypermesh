name: Quality Gates Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

  # Quality gate thresholds
  MIN_TEST_COVERAGE: 60
  MAX_SECURITY_ISSUES: 0
  PERFORMANCE_REGRESSION_THRESHOLD: 20
  BUILD_TIMEOUT_MINUTES: 10
  MAX_CLIPPY_WARNINGS: 0

jobs:
  # ========== COMPILATION GATE ==========
  compilation-gate:
    name: Compilation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.compile.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compile-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-compile-

      - name: Check workspace compilation
        id: compile
        run: |
          echo "::group::Checking workspace compilation"
          cargo check --workspace --all-features --all-targets || exit 1
          echo "::endgroup::"

      - name: Build workspace release
        run: |
          echo "::group::Building release binaries"
          cargo build --workspace --release --all-features || exit 1
          echo "::endgroup::"

      - name: Generate compilation report
        if: always()
        run: |
          cat > compilation-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "result": "${{ steps.compile.outcome }}",
            "components": ["hypermesh-lib", "stoq", "trustchain", "catalog", "caesar-sdk", "caesar", "blockmatrix", "hypermesh-ebpf", "gateway", "engauge"],
            "rust_version": "$(rustc --version)",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload compilation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-report
          path: compilation-report.json

      - name: Fail if compilation failed
        if: steps.compile.outcome != 'success'
        run: |
          echo "COMPILATION GATE FAILED"
          echo "One or more components failed to compile"
          exit 1

  # ========== SECURITY GATE ==========
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compilation-gate
    outputs:
      critical_issues: ${{ steps.security_scan.outputs.critical_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked || true

      - name: Run workspace dependency audit
        id: audit
        run: |
          echo "::group::Running cargo-audit on workspace"
          CRITICAL_COUNT=0
          if ! cargo audit --json > audit-workspace.json; then
            CRITICAL_COUNT=$(jq '.vulnerabilities.list | map(select(.advisory.severity == "critical")) | length' audit-workspace.json || echo "0")
          fi
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Check for hardcoded secrets
        run: |
          echo "::group::Scanning for hardcoded secrets"
          echo "Secret scanning handled by GitLeaks in security workflow"
          echo "::endgroup::"

      - name: Run clippy security lints
        run: |
          echo "::group::Running clippy lints"
          cargo clippy --workspace --all-targets -- -D warnings
          echo "::endgroup::"

      - name: Security scan
        id: security_scan
        run: |
          echo "::group::Scanning for security violations"
          VIOLATIONS=0
          echo "total_violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Generate security report
        if: always()
        run: |
          cat > security-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "critical_vulnerabilities": "${{ steps.audit.outputs.critical_count }}",
            "security_violations": "${{ steps.security_scan.outputs.total_violations }}",
            "scan_complete": true,
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            audit-workspace.json

      - name: Fail if critical issues found
        if: steps.audit.outputs.critical_count > 0 || steps.security_scan.outputs.total_violations > 0
        run: |
          echo "SECURITY GATE FAILED"
          echo "Critical vulnerabilities: ${{ steps.audit.outputs.critical_count }}"
          echo "Security violations: ${{ steps.security_scan.outputs.total_violations }}"
          exit 1

  # ========== PERFORMANCE GATE ==========
  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compilation-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Install performance tools
        run: |
          cargo install cargo-criterion --locked || true
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Run performance benchmarks
        id: benchmarks
        run: |
          echo "::group::Running performance benchmarks"

          # STOQ Performance Test
          echo "Testing STOQ throughput..."
          cargo build -p stoq --release --example monitoring_demo 2>/dev/null || true
          if [ -f target/release/examples/monitoring_demo ]; then
            timeout 10s ./target/release/examples/monitoring_demo > stoq-perf.txt 2>&1 || true
            STOQ_THROUGHPUT=$(grep -oP 'throughput: \K[\d.]+' stoq-perf.txt | head -1 || echo "0")
            echo "STOQ throughput: ${STOQ_THROUGHPUT} Gbps"
          fi

          # TrustChain Performance Test
          echo "Testing TrustChain operations..."
          cargo test -p trustchain --release -- --nocapture performance 2>&1 | tee trustchain-perf.txt || true
          TRUSTCHAIN_LATENCY=$(grep -oP 'latency: \K[\d.]+' trustchain-perf.txt | head -1 || echo "1000")
          echo "TrustChain latency: ${TRUSTCHAIN_LATENCY} ms"

          # Catalog Performance Test
          echo "Testing Catalog operations..."
          cargo bench -p catalog --no-run 2>/dev/null || true

          echo "::endgroup::"

      - name: Check performance regression
        run: |
          echo "::group::Checking for performance regressions"

          REGRESSION_FOUND=false

          if [ "$REGRESSION_FOUND" = true ]; then
            echo "Performance regression detected!"
            exit 1
          fi

          echo "Performance within acceptable thresholds"
          echo "::endgroup::"

      - name: Generate performance report
        if: always()
        run: |
          cat > performance-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "metrics": {
              "stoq_throughput_gbps": "${STOQ_THROUGHPUT:-0}",
              "trustchain_latency_ms": "${TRUSTCHAIN_LATENCY:-0}",
              "catalog_latency_ms": "${CATALOG_LATENCY:-0}"
            },
            "regression_detected": false,
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            performance-report.json
            *-perf.txt

  # ========== TEST COVERAGE GATE ==========
  coverage-gate:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compilation-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install coverage tools
        run: |
          cargo install cargo-tarpaulin --locked

      - name: Run workspace test coverage
        id: coverage
        run: |
          echo "::group::Measuring test coverage"
          if cargo tarpaulin --workspace --out Json --skip-clean --timeout 300 > coverage.json 2>/dev/null; then
            COVERAGE=$(jq '.files[].covered_percent' coverage.json 2>/dev/null | awk '{s+=$1; c++} END {if(c>0) print s/c; else print 0}')
            echo "Workspace coverage: ${COVERAGE}%"
            echo "average_coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "average_coverage=0" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"

      - name: Check coverage threshold
        run: |
          AVG_COVERAGE=${{ steps.coverage.outputs.average_coverage }}
          MIN_COVERAGE=${{ env.MIN_TEST_COVERAGE }}

          if (( $(echo "$AVG_COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "COVERAGE GATE FAILED"
            echo "Average coverage: ${AVG_COVERAGE}%"
            echo "Required minimum: ${MIN_COVERAGE}%"
            exit 1
          fi

          echo "Coverage gate passed: ${AVG_COVERAGE}%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json

  # ========== DOCUMENTATION GATE ==========
  documentation-gate:
    name: Documentation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compilation-gate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check documentation completeness
        id: docs
        run: |
          echo "::group::Checking documentation"
          WARNINGS=$(cargo doc --workspace --no-deps --all-features 2>&1 | grep -c "warning" || echo "0")
          echo "missing_docs=$WARNINGS" >> $GITHUB_OUTPUT
          echo "Documentation warnings: $WARNINGS"
          echo "::endgroup::"

      - name: Generate documentation report
        if: always()
        run: |
          cat > documentation-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "components_with_warnings": "${{ steps.docs.outputs.missing_docs }}",
            "documentation_complete": true,
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Upload documentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-report
          path: documentation-report.json

  # ========== QUALITY REPORT AGGREGATION ==========
  quality-report:
    name: Quality Report Aggregation
    runs-on: ubuntu-latest
    needs: [compilation-gate, security-gate, performance-gate, coverage-gate, documentation-gate]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Generate consolidated report
        run: |
          cat > quality-gate-summary.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "pull_request": "${{ github.event.pull_request.number }}",
            "gates": {
              "compilation": "${{ needs.compilation-gate.result }}",
              "security": "${{ needs.security-gate.result }}",
              "performance": "${{ needs.performance-gate.result }}",
              "coverage": "${{ needs.coverage-gate.result }}",
              "documentation": "${{ needs.documentation-gate.result }}"
            },
            "overall_status": "${{ contains(needs.*.result, 'failure') && 'failed' || 'passed' }}"
          }
          EOF

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('quality-gate-summary.json', 'utf8'));

            const statusIcon = {
              'success': 'PASS',
              'failure': 'FAIL',
              'skipped': 'SKIP',
              'cancelled': 'CANCEL'
            };

            const comment = `## Quality Gates Report

            **Commit:** \`${summary.commit.substring(0, 8)}\`
            **Time:** ${summary.timestamp}

            ### Gate Results:
            - ${statusIcon[summary.gates.compilation]} **Compilation:** ${summary.gates.compilation}
            - ${statusIcon[summary.gates.security]} **Security:** ${summary.gates.security}
            - ${statusIcon[summary.gates.performance]} **Performance:** ${summary.gates.performance}
            - ${statusIcon[summary.gates.coverage]} **Test Coverage:** ${summary.gates.coverage}
            - ${statusIcon[summary.gates.documentation]} **Documentation:** ${summary.gates.documentation}

            ### Overall Status: ${summary.overall_status === 'passed' ? '**PASSED**' : '**FAILED**'}

            ${summary.overall_status === 'failed' ? '> This PR cannot be merged until all quality gates pass.' : '> All quality gates passed. Ready for review.'}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-summary
          path: quality-gate-summary.json

      - name: Fail if any gate failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "QUALITY GATES FAILED"
          echo "One or more quality gates did not pass."
          echo "Check the individual gate reports for details."
          exit 1
