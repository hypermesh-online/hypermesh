name: Comprehensive Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Daily validation

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Phase 1: Basic validation
  validation:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --workspace --all-features

  # Phase 2: Unit testing
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validation
    strategy:
      matrix:
        component:
          - hypermesh-lib
          - stoq
          - trustchain
          - catalog
          - caesar-sdk
          - caesar
          - blockmatrix
          - hypermesh-ebpf
          - gateway
          - engauge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run unit tests for ${{ matrix.component }}
        run: cargo test -p ${{ matrix.component }} --lib

      - name: Generate test report
        if: always()
        run: |
          cargo test -p ${{ matrix.component }} --lib -- --format json > test-results-${{ matrix.component }}.json 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.component }}
          path: test-results-${{ matrix.component }}.json

  # Phase 3: Integration testing
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run workspace integration tests
        run: cargo test --workspace --test '*' --all-features

  # Phase 4: Security testing
  security-tests:
    name: Security Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install security tools
        run: |
          cargo install cargo-audit
          cargo install cargo-deny || true

      - name: Run security audit
        run: cargo audit

      - name: Check dependencies
        run: cargo deny check || true

  # Phase 5: Performance testing
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run benchmarks
        run: cargo bench --workspace || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: target/criterion

  # Phase 6: Coverage analysis
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --all-features --workspace --out Xml

      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Phase 7: UI tests (unit + E2E)
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check for UI changes
        id: ui-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- ui/ 2>/dev/null | head -1)
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- ui/ 2>/dev/null | head -1)
          else
            CHANGES="scheduled"
          fi
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.ui-changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.ui-changes.outputs.has_changes == 'true'
        working-directory: ui/frontend
        run: npm install

      - name: Run unit tests (vitest)
        if: steps.ui-changes.outputs.has_changes == 'true'
        working-directory: ui/frontend
        run: npx vitest run --reporter=verbose

      - name: Install Playwright browsers
        if: steps.ui-changes.outputs.has_changes == 'true'
        working-directory: ui/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright - chromium only)
        if: steps.ui-changes.outputs.has_changes == 'true'
        working-directory: ui/frontend
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always() && steps.ui-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: ui/frontend/test-results/
