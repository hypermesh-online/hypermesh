name: Release

# Phase C.1 — cross-platform builds + GitHub release matrix
#
# Trigger: pushing a tag matching v*.*.* (semver), or manual dispatch.
# Output: Per-target archives + an unsigned `release-manifest.json` matching the
# `release.feed/v1` typedef (catalog/typedefs/release_feed.json). The foundation
# operator signs the manifest offline with the FALCON-1024 root key and
# re-uploads the signed version. See docs/RELEASING.md.
#
# eBPF feature gating
# -------------------
# `hypermesh-ebpf` (a hard dep of `blockmatrix`) currently includes `aya` and
# `libbpf-sys` unconditionally. `libbpf-sys` requires Linux kernel headers and
# will not link on macOS / Windows. Until those crates are gated as
# `[target.'cfg(target_os = "linux")']` deps in hypermesh-ebpf/Cargo.toml
# (Phase C.2 follow-up), only Linux targets are guaranteed buildable.
#
# Non-Linux targets are present in the matrix with `continue-on-error: true`
# so the workflow surfaces porting progress without blocking foundation
# releases. The release-manifest assembly job tolerates missing artifacts.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.2.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ------------------------------------------------------------------
  # 1. Create the empty GitHub Release record (binaries attached later)
  # ------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_no_v: ${{ steps.version.outputs.version_no_v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --format="- %s (%h)" "${PREV_TAG}..HEAD"
            else
              git log --format="- %s (%h)" --max-count=50
            fi
            echo
            echo "## Verification"
            echo
            echo "Each binary's SHA-256 is recorded in \`release-manifest.json\` (attached)."
            echo "After foundation FALCON-1024 signing, the signed manifest replaces the unsigned one."
            echo "See [docs/RELEASING.md](https://github.com/${{ github.repository }}/blob/main/docs/RELEASING.md)."
          } > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HyperMesh ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}

  # ------------------------------------------------------------------
  # 2. Build the `hypermesh` binary across the target matrix
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 musl — primary deployment target (trust.hypermesh.online).
          # Static-pie ELF, no glibc dependency. Includes intelligence + caesar.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            features: caesar,intelligence
            archive_ext: tar.gz
            cross: true
            experimental: false

          # Linux aarch64 (Raspberry Pi, ARM cloud, Apple Silicon Linux VMs).
          # Built via cross to pull in the aarch64 musl toolchain reliably.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            features: caesar,intelligence
            archive_ext: tar.gz
            cross: true
            experimental: false

          # macOS x86_64 — experimental until hypermesh-ebpf is target-gated.
          # Currently expected to fail on libbpf-sys link; kept in matrix to
          # surface progress as porting work lands.
          - target: x86_64-apple-darwin
            runner: macos-latest
            features: caesar
            archive_ext: tar.gz
            cross: false
            experimental: true

          # macOS aarch64 (Apple Silicon) — experimental, same reason.
          - target: aarch64-apple-darwin
            runner: macos-latest
            features: caesar
            archive_ext: tar.gz
            cross: false
            experimental: true

          # Windows x86_64 — experimental, same reason.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: caesar
            archive_ext: zip
            cross: false
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compile)
        if: matrix.cross == true
        run: |
          cargo install cross --locked --version 0.2.5 || true

      - name: Build (cross — Linux)
        if: matrix.cross == true
        env:
          CROSS_NO_WARNINGS: "0"
        run: |
          cross build \
            --release \
            --target ${{ matrix.target }} \
            -p blockmatrix \
            --bin hypermesh \
            --features ${{ matrix.features }} \
            --locked

      - name: Build (native — macOS/Windows)
        if: matrix.cross == false
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }} \
            -p blockmatrix \
            --bin hypermesh \
            --features ${{ matrix.features }} \
            --locked

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/hypermesh"
          if [ -f "$BIN" ]; then
            if [[ "${{ matrix.target }}" == *darwin* ]]; then
              strip -x "$BIN" || true
            else
              strip "$BIN" || true
            fi
          fi

      - name: Compute SHA-256 (Unix)
        if: runner.os != 'Windows'
        id: hash_unix
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/hypermesh"
          if [ ! -f "$BIN" ]; then
            echo "Binary missing; build presumably failed." >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=$(sha256sum "$BIN" | awk '{print $1}')
          else
            HASH=$(shasum -a 256 "$BIN" | awk '{print $1}')
          fi
          echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 (Windows)
        if: runner.os == 'Windows'
        id: hash_windows
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/hypermesh.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "Binary missing; build presumably failed."
            exit 1
          }
          $hash = (Get-FileHash -Algorithm SHA256 $bin).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package (Unix tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="hypermesh-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/hypermesh" "$STAGE/"
          # Bundle minimal install metadata
          cp scripts/install.sh "$STAGE/install.sh" 2>/dev/null || true
          tar czf "${STAGE}.tar.gz" "$STAGE"
          ls -lh "${STAGE}.tar.gz"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "hypermesh-${{ needs.create-release.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hypermesh.exe" "$stage/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Write hash artifact
        shell: bash
        run: |
          mkdir -p hashes
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            HASH="${{ steps.hash_windows.outputs.sha256 }}"
          else
            HASH="${{ steps.hash_unix.outputs.sha256 }}"
          fi
          echo "${HASH}  ${{ matrix.target }}" > "hashes/${{ matrix.target }}.sha256"

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            hypermesh-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Upload hash artifact (for manifest job)
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target }}
          path: hashes/${{ matrix.target }}.sha256
          retention-days: 1

  # ------------------------------------------------------------------
  # 3. Assemble unsigned release-manifest.json from collected hashes
  # ------------------------------------------------------------------
  manifest:
    name: Assemble release-manifest.json
    needs: [create-release, build]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all hash artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sha256-*
          merge-multiple: true

      - name: Build manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version_no_v }}
          TAG: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Determine channel from version tag
          if echo "$VERSION" | grep -qE '(rc|beta|alpha)'; then
            if echo "$VERSION" | grep -q 'alpha'; then
              CHANNEL="nightly"
            else
              CHANNEL="beta"
            fi
          else
            CHANNEL="stable"
          fi

          # Collect hashes — produce a sorted, canonical JSON object
          python3 - <<'PY' > out/binary_hashes.json
          import json, os, glob
          out = {}
          for path in sorted(glob.glob("artifacts/*.sha256")):
              with open(path) as f:
                  line = f.read().strip()
              if not line:
                  continue
              parts = line.split()
              if len(parts) < 2:
                  continue
              digest, target = parts[0], parts[1]
              out[target] = digest
          # Canonical: sorted keys, no whitespace
          print(json.dumps(out, sort_keys=True, separators=(",", ":")))
          PY

          ISSUED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BINARY_HASHES_JSON=$(cat out/binary_hashes.json)

          python3 - <<PY > release-manifest.json
          import json
          manifest = {
              "version": "$VERSION",
              "channel": "$CHANNEL",
              "binary_hashes": json.loads('''$BINARY_HASHES_JSON'''),
              "release_notes_url": "https://github.com/$REPO/releases/tag/$TAG",
              "issued_at": "$ISSUED_AT",
              "breaking_changes": False,
              "signed_by": "",
              "signature": ""
          }
          # Pretty-print for human review; signing is over the canonical
          # signing_payload (see release.feed typedef), not over this file.
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

          echo "----- release-manifest.json -----"
          cat release-manifest.json
          echo "----- canonical signing input (binary_hashes only) -----"
          cat out/binary_hashes.json

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: release-manifest.json

      - name: Notice — foundation signing required
        run: |
          echo "::notice title=Manifest unsigned::release-manifest.json is unsigned. Foundation operator must sign with FALCON-1024 root key (see docs/RELEASING.md) and re-upload."
