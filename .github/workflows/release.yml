name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --format="- %s (%h)" ${PREV_TAG}..HEAD > changelog.md
          else
            git log --format="- %s (%h)" --max-count=50 > changelog.md
          fi
          echo "## What's Changed" > release_notes.md
          cat changelog.md >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') }}

  build-binaries:
    name: Build Release Binaries
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build workspace release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }} --locked

      - name: Package binaries
        run: |
          cd target/${{ matrix.target }}/release
          # Package any produced binaries
          for bin in $(find . -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.so' ! -name '*.dylib' ! -name '*.rlib' 2>/dev/null || true); do
            NAME=$(basename "$bin")
            tar czf "${NAME}-${{ needs.create-release.outputs.version }}-${{ matrix.suffix }}.tar.gz" "$NAME"
            mv *.tar.gz ${{ github.workspace }}/ 2>/dev/null || true
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: "*.tar.gz"

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    if: "!contains(needs.create-release.outputs.version, 'rc') && !contains(needs.create-release.outputs.version, 'beta')"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          # Publish in dependency order (leaf dependencies first)
          CRATES=(
            hypermesh-lib
            stoq
            trustchain
            catalog
            caesar-sdk
            caesar
            blockmatrix
            hypermesh-ebpf
            gateway
            engauge
          )

          for crate in "${CRATES[@]}"; do
            echo "Publishing $crate..."
            cargo publish -p "$crate" --no-verify || echo "$crate: publish failed or already published"
            sleep 15  # Wait for crates.io to index
          done
