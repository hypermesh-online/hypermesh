[crate]
name = "HyperMesh Lib"
id = "hypermesh-lib"
description = "Shared canonical types for the HyperMesh ecosystem"
phase = "alpha"

[features.working]
items = [
    # These are type definitions and helper functions — they are genuinely correct and complete
    "NodeId, AssetId, NetworkId, and ContentHash newtypes",
    "PrivacyMode struct (2-axis: AccessScope + tracked)",
    "BlockchainScope enum (Device | Network)",
    "ProofType enum (PoSpace/PoStake/PoWork/PoTime)",
    "MatrixPosition coordinate type",
    "PipelineStage enum",
    "CryptoAlgorithm enum (Falcon/Kyber/AES)",
    "HypermeshError unified error type",
    "Three-pillar asset system (AssetKind + BaseState/AssetStatusTrait + AssetAdapter)",
    "Canonical state proof types (SpaceProof/StakeProof/WorkProof/TimeProof/ProofOfState + Validatable trait)",
    "EVP economic types (PacketId, GoldGrams, MarketTier, PacketState, DemurrageRate)",
    "AssetAddress IPv6 type (fd48:4d00 prefix, matrix coords, content fingerprint, shard sub-addressing)",
    "Transmission asset type in SystemAssetKind (R10)",
    "SystemAssetKind::Identity and KeyRotation variants for MFA identity lifecycle (§6.2)",
    "ErasureCodingParams with adaptive shard sizing (R14 — for_asset_size scales RS parameters)",
    "Shard, ShardMetadata, ShardingStats, ShardingError types (A1 — moved here from blockmatrix as part of the sharding→NGauge move; live in lib so consumers avoid an ngauge dependency cycle, serde layout unchanged; Shard::calculate_hash/verify are BLAKE3 integrity helpers)",
    "HardwareCapabilities with minimum spec enforcement (R1/R13 — meets_minimum_spec validation)",
    "BLAKE3 validation helpers (validate_blake3_hash, compute_blake3_hash)",
    "ShardCommitment type (R12 — BLAKE3(sorted placements) compute/verify API)",
    "GenesisAssetRecord type (R1+R10 — capability structs for genesis inventory)",
    "Shared serialization via postcard (encode/decode/encode_bounded)",
    "Unified NodeId type (BLAKE3([u8;32]) from FALCON-1024 pubkey)",
    "Scope-aware identity types (WorkloadType, IdentityScope, ScopedIdentity)",
    "Cross-crate validation helpers (validate_node_id, validate_content_hash, etc.)",
    "Runtime state types (NodeState, NetworkState, SyncStatus, RuntimeSnapshot)",
    "Common test utilities (test fixtures for all canonical types)",
    "Public SDK types (SdkCapabilities, AssetDescriptor, NodeDescriptor, QueryResult<T>)",
]

[features.in_development]
items = [
    # Lib types are defined but some are not yet exercised by real implementations
    "State proof types — defined and have Validatable trait, but consuming crates generate fake proofs",
    "BlockchainScope::Network — blockmatrix implements Network scope sync MVP (block propagation, gossip, cross-genesis insertion, E2E two-node over QUIC)",
]

[features.planned]
items = []
