[crate]
name = "HyperMesh Lib"
id = "hypermesh-lib"
description = "Shared canonical types for the HyperMesh ecosystem"
phase = "alpha"

[features.working]
items = [
    "NodeId, AssetId, NetworkId, and ContentHash newtypes",
    "PrivacyMode struct (2-axis: AccessScope + tracked)",
    "BlockchainScope enum (Device | Network)",
    "ProofType enum (PoSpace/PoStake/PoWork/PoTime)",
    "MatrixPosition coordinate type",
    "PipelineStage enum",
    "CryptoAlgorithm enum (Falcon/Kyber/AES)",
    "HypermeshError unified error type",
    "Three-pillar asset system (AssetKind + BaseState/AssetStatusTrait + AssetAdapter)",
    "Canonical consensus proof types (SpaceProof/StakeProof/WorkProof/TimeProof/ProofOfState + Validatable trait)",
    "EVP economic types (PacketId, GoldGrams, MarketTier, PacketState, DemurrageRate)",
    "KeyPairId and AssetMetadata structs",
    "AssetAddress IPv6 type (fd48:4d00 prefix, matrix coords, content fingerprint, shard sub-addressing)",
    "Transmission asset type in SystemAssetKind (R10 — first-class mesh relay bandwidth asset)",
    "ErasureCodingParams with adaptive shard sizing (R14 — for_asset_size scales RS parameters)",
    "HardwareCapabilities with minimum spec enforcement (R1/R13 — meets_minimum_spec validation)",
    "BLAKE3 validation helpers (validate_blake3_hash, compute_blake3_hash for R4)",
    "AssetMetadata canonical struct in lib (consolidated definition with AssetKind + state + timestamps)",
    "Dns and Transmission variants added to blockmatrix BaseSystemType",
    "VirtualMachine and Library removed from blockmatrix AssetType/BaseSystemType",
    "Trustchain proof types linked to lib canonical ProofType (proof_type() methods)",
    "Trustchain NodeId/AssetId renamed to AuthenticatedNode/AuthenticatedAsset (use lib newtypes)",
    "AssetMetadata consolidated (crate-local copies renamed: PipelineInputMetadata, PackageSpecMetadata, etc.)",
    "PacketId conflict resolved (blockmatrix network isolation uses IsolationPacketId)",
    "ShardCommitment type (R12 — BLAKE3(sorted placements) compute/verify API)",
    "Genesis asset inventory types (R1 — Cpu/Gpu/Storage/Network/Memory capability structs)",
    "GenesisAssetRecord type (R1+R10 — sovereign genesis with hardware-assessed IPv6 assets)",
    "Shared serialization via postcard (encode/decode/encode_bounded + EncodingError)",
]

[features.in_development]
items = [
    "Cross-crate validation helpers",
    "Runtime state unification — all HyperMesh network execution and on-chain operations use Asset typedefs/impls",
    "Common test utilities",
    "Public SDK types for third-party integration (stable API surface)",
    "Unified NodeId type (currently opaque String, needs to derive from assessed hardware → keypair → certificate)",
    "Scope-aware identity types (identity that respects BlockchainScope Device|Network and traceability axis)",
]

[features.planned]
items = [
]
