[crate]
name = "Gateway"
id = "gateway"
description = "HTTP/3 + STOQ gateway for *.hypermesh.online — 4 roles: bootstrap, inbound proxy, outbound proxy, inter-network"
phase = "alpha"

[features.working]
items = [
    # HTTP/3 server (real, deployed, serving traffic)
    "QUIC/HTTP3 server setup (quinn + h3)",
    "TLS provider (File/TrustChain/SelfSigned certificate sources)",
    "Connection pool with health checks",
    "Router with path-based backend selection",
    "Circuit breaker and retry logic",
    "CORS middleware and request logging",
    "HTTP/3 backend proxying (gateway forwards HTTP/3 to TCP backends, NOT STOQ)",
    "Rate limiting and DDoS protection (token bucket per-IP/identity/global)",
    "Load balancing (RoundRobin/LeastConnections/WeightedRoundRobin/HealthAware)",
    "Multi-domain SNI routing (*.hypermesh.online wildcard support)",
    "Inbound proxy for HyperMesh dashboards",
    "Health check aggregation — /health checks all 5 backend services",
    # Backend routing (real, deployed — HTTP/3 to TCP, not STOQ)
    "TrustChain backend routing (gateway -> [::1]:8444)",
    "BlockMatrix backend routing (gateway -> [::1]:9292)",
    "Caesar backend routing (gateway -> [::1]:9294)",
    "Catalog backend routing (gateway -> [::1]:9295)",
    "Engauge backend routing (gateway -> [::1]:9296)",
    "Engauge API routing (/api/v1/engauge)",
    # Dashboard serving
    "Scope-aware dashboard server (DashboardServer with scope determination, content-type detection, caching)",
    "Dashboard load_from_directory and load_defaults methods for populating scope-aware cache",
    "trust.hypermesh.online onboarding dashboard (public landing, private topology, admin controls)",
    "STOQ protocol bridge — stoq_bridge.rs and stoq_listener.rs wired into main.rs, runs alongside HTTP/3 on port 8444 (configurable), graceful degradation if port unavailable",
    "Production config loader — GatewayConfig::load() cascades GATEWAY_CONFIG env → ~/.hypermesh/gateway.toml → defaults, with per-field env overrides",
    # Browser namespace (L5)
    "DNS-over-HTTPS (DoH) endpoint — JSON-based DNS query/response for browser-compatible resolution",
    "Host→DNS resolution — extract_subdomain() maps Host header to blockchain DNS entries",
    "Dynamic per-domain TLS certificates — generate_domain_cert() creates ECDSA P-256 self-signed certs on demand",
    "DomainRouter.resolve_from_dns() — query blockchain DNS for domain→backend routing",
    # Phase K.2 — remote dashboard proxy + 3 modes
    "RemoteDashboardProxy — byte-forwarder over an existing STOQ stream (X25519MLKEM768 transport encryption + FALCON-PoS auth provided by STOQ; Kyber-AES is the asset-at-rest layer not used here); capability token rides in the forwarded envelope for target-side auth",
    "Three remote-dashboard modes — DashboardServeMode::TrustProxy / PrivateDomain / SelfHosted (parses --dashboard-mode CLI flag)",
    "RemoteProxyManager — per-session registry with register/get/close/reap_inactive lifecycle",
    "ForwardedRequest/ForwardedResponse — minimal HTTP envelope shape forwarded over the STOQ stream",
    "StoqStreamForwarder trait — abstracts STOQ stream open/write/read for the proxy; MockStreamForwarder ships for tests, production wiring binds Connection::open_stream from gateway's NetworkManager handle",
    # Phase P4/F8 — configurable gateway auth mode
    "StoqAuthMode { HttpProxy (default) | FullStoqPos } — config + CLI + env parse; HttpProxy is a plain reverse proxy (no PoS, backwards-compatible), FullStoqPos requires a bilateral PoS handshake per connection",
    "FullStoqPos handshake enforcement — StoqListener runs StoqBridge::perform_pos_handshake on accept and DROPS un-authenticated connections; StoqBridge::new_full_stoq_pos requires a NodeSigner + StateProofProvider (inherits the F2 signer↔identity binding)",
    "NodeSigner + StateProofProvider wired into StoqBridge — gateway depends on trustchain for FALCON-1024 identity + TrustChainProofProvider (path dep, no cycle: trustchain does not depend on gateway)",
    # Phase F9/P8 — dual-CA integration
    "Dual-CA integration — gateway connects to the clearnet CA at trust_chain_addr=[::1]:8444 (trustchain-http3.service); systemd unit requires trustchain-http3.service (the single trustchain.service was retired in the F9 split)",
    "Gateway's own STOQ listener disabled by default — stoq_listen_addr omitted (Option→None) so port 8444 is left to trustchain-http3; gateway serves clearnet over HTTP/3 on 8443, with stoq_max_connections bounding the STOQ bridge",
]

[features.in_development]
items = [
    # Production STOQ wiring for RemoteDashboardProxy: bind StoqStreamForwarder to NetworkManager
    "Production StoqStreamForwarder — wire MockStreamForwarder replacement that opens a real STOQ stream via Connection::open_stream and round-trips request bytes; depends on gateway-side NetworkManager handle reaching remote_proxy",
    "HTTP/3 bootstrap-token validation — token issued via HTTP/3 is still NOT cross-validated at the STOQ layer; FullStoqPos now enforces a real bilateral PoS handshake per connection, but the HTTP/3-issued bootstrap token is not yet bound to that handshake",
    "Cross-scope routing — ScopeRouter exists but Device/Network scope bridging not functional (Network scope not implemented)",
    "Federation bridge — trust level structs exist but no real cross-network STOQ relay (no federated peers)",
    "Cross-scope transfer proxy — Phase G.1 wire protocol + coordinator + G.2 chain-scan recovery + PeerContext wire dispatch landed in blockmatrix (5/5 g1_transfer + 4/4 g2_transfer tests pass); gateway-side cross-network proxying still pending (e2e routing of TAG_TRANSFER_* through GatewayManager scoped to Phase I)",
    "Outbound proxy with allowlist filtering — code exists, not tested",
    "Backend service discovery (resolve by address or service registry)",
]

[features.planned]
items = [
    "PoS authentication subsystem — Phase 2, beyond Phase 0 bootstrap (self-signed + PoS handshake at STOQ layer is sufficient). Former AuthManager/BootstrapHandler/authenticate_stoq_with_proof was never wired into the request pipeline and has been removed. Can be resurrected from git history when multi-tenant HTTP/3 auth is needed.",
    "Bootstrap token flow — HTTP/3 side issues tokens but validation path beyond self-serve PoS handshake not implemented",
]
