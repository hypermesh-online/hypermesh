[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared types (single source of truth)
hypermesh-lib = { workspace = true }

tokio = { version = "1.41", features = ["full"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2.0"
rustls-native-certs = "0.8"
http = "1.1"
bytes = "1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
anyhow = "1.0"
dashmap = "6.1"
arc-swap = "1.7"
futures = "0.3"
pin-project = "1.1"
thiserror = "2.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tower = "0.5"
hyper = "1.5"

[[bin]]
name = "gateway"
path = "src/main.rs"

[[bin]]
name = "test-week1-endpoints"
path = "src/bin/test_week1_endpoints.rs"

[lints]
workspace = true
