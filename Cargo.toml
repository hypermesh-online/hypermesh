[workspace]
members = [
    "lib",
    "base",
    "stoq",
    "trustchain",
    "caesar",
    "caesar-sdk",
    "catalog",
    "blockmatrix",
    "hypermesh-ebpf",
    "gateway",
    "ngauge",
    "hypermesh-sdk",
    "hypermesh-ffi",
]
resolver = "2"

# Coherent workspace-wide package metadata. Members inherit these with
# `version.workspace = true` etc., eliminating the version skew (ngauge/caesar
# were 1.0.0 while every other crate was 0.1.0). The IPC protocol version
# (`IPC_PROTOCOL_VERSION = env!("CARGO_PKG_VERSION")`) now resolves coherently to
# this single value across the whole daemon.
[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["HyperMesh Team"]
license = "MIT OR Apache-2.0"

# Unified dependency management for workspace
[workspace.dependencies]
# Core async runtime
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tokio-test = "0.4"
async-trait = "0.1"
futures = "0.3"

# QUIC and networking
quinn = "0.11"
# Post-quantum QUIC: X25519MLKEM768 hybrid key exchange via aws-lc-rs
rustls = { version = "0.23", features = ["aws_lc_rs", "prefer-post-quantum"] }
rustls-pemfile = "2.2"
rcgen = "0.13"
socket2 = "0.5"
bytes = { version = "1.6", features = ["serde"] }
webpki-roots = "0.26"
# Substrate layer (core/base) — link/carrier/address management via netlink.
# Declared now for the scaffold; consumed by the rtnetlink_linux adapter in Phase 1/2.
# NOTE: verify musl-buildability before Phase 1 (deploy target builds musl static-pie).
rtnetlink = "0.14"
netlink-packet-route = "0.19"

# HTTP and web
# REMOVED: Legacy HTTP/REST frameworks (axum, tower, hyper, warp, reqwest, http, http-body-util)
# HTTP/3 (QUIC) is still used by the Gateway crate for bootstrap + clearnet proxy.
# Everything else is STOQ-only.
# h3 / h3-quinn are not workspace deps — Gateway uses quinn directly for HTTP/3 framing.

# Cryptography
ring = "0.17"
rust_decimal = "1.35"
sha2 = "0.10"
sha1 = "0.10"
sha3 = "0.10"
hmac = "0.12"
blake3 = "1.5"
merkletree = "0.23"
ed25519-dalek = "2.0"
# rsa = "0.9"  # REMOVED: RUSTSEC-2023-0071 - Unfixable Marvin Attack vulnerability
aes-gcm = "0.10"

# Post-quantum cryptography
pqcrypto = "0.17"
pqcrypto-falcon = "0.3"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"

# Certificate handling
x509-parser = "0.16"
der-parser = "9.0"
pem = "3.0"
der = "0.7"

# DNS (trust-dns only — hickory is the renamed project, removed duplicate)
trust-dns-client = "0.23"
trust-dns-proto = "0.23"

# Data structures
dashmap = "6.0"
arc-swap = "1.7"
crossbeam = "0.8"
parking_lot = "0.12"
lock_api = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_bytes = "0.11"
toml = "0.8"
bincode = "1.3"
postcard = { version = "1", features = ["alloc"] }
# config = "0.14"  # REMOVED: Only used for config::ConfigError in 1 file, replaced with toml::de::Error

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time and utilities
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
num_cpus = "1.16"
lazy_static = "1.4"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Storage (BlockMatrix Asset-based, no traditional databases)
# sled = "0.34"  # REMOVED: Zero usage in source code, unmaintained since 2021
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }  # For caching only

# Testing
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
tempfile = "3.10"

# Performance
sysinfo = "0.30"

# Compression
zstd = "0.13"
lz4 = "1.24"
brotli = "8.0"
reed-solomon-erasure = "6.0"
flate2 = "1.0"
tar = "0.4"

# Shared library
hypermesh-lib = { path = "lib" }

# Additional
glob = "0.3"
regex = "1.10"
shellexpand = "3.1"
handlebars = "5.1"
libloading = "0.8"
semver = "1.0"
fastrand = "2.0"
# which = ... # REMOVED: zero usage in codebase
# prometheus = ... # REMOVED: Build native monitoring (100% standalone requirement)

[package]
name = "web3"
version = "1.0.0"
edition = "2021"
authors = ["HyperMesh Team"]
description = "Web3 Ecosystem - Unified STOQ/HyperMesh/TrustChain/Caesar/Catalog Stack"
license = "MIT OR Apache-2.0"
keywords = ["hypermesh", "protocol", "stoq", "trustchain", "proof-of-state"]

[dependencies]
# Use workspace dependencies
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# STOQ Transport (embedded) - QUIC over IPv6 foundation
quinn = { workspace = true }
rustls = { workspace = true }
socket2 = { workspace = true }
bytes = { workspace = true }
stoq = { path = "stoq" }  # Local STOQ protocol implementation
caesar = { path = "caesar" }  # Local Caesar economic system

# HTTP/3 Bridge for browser compatibility
# h3 = ... # REMOVED: Never used, STOQ-only transport
# h3-quinn = ... # REMOVED: Never used, STOQ-only transport
# http = ... # REMOVED: STOQ-only transport (no HTTP)
# http-body-util = ... # REMOVED: STOQ-only transport

# High-performance data structures for 40 Gbps optimization
dashmap = { workspace = true }
arc-swap = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }

# TrustChain CA (embedded) - Certificate authority and DNS
x509-parser = { workspace = true }
der-parser = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
pem = { workspace = true }
der = { workspace = true }

# Post-quantum cryptography (FALCON-1024 + Kyber)
pqcrypto-falcon = { workspace = true }
pqcrypto-kyber = { workspace = true }
pqcrypto-traits = { workspace = true }
aes-gcm = { workspace = true }

# DNS resolution: trustchain uses trust-dns-client/proto directly
# hickory-client = ... # REMOVED: hickory IS trust-dns renamed, zero usage in root
# hickory-proto = ... # REMOVED: same

# HyperMesh Assets (embedded) - Proof of State and asset management
sha2 = { workspace = true }
sha1 = { workspace = true }
sha3 = { workspace = true }
hmac = { workspace = true }
blake3 = { workspace = true }
merkletree = { workspace = true }
uuid = { workspace = true }
num_cpus = { workspace = true }

# Serialization and configuration
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }

# Error handling and logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time and data handling
chrono = { workspace = true }
time = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# rsa = { workspace = true }  # REMOVED: RUSTSEC-2023-0071

# Performance monitoring
sysinfo = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
lazy_static = { workspace = true }
trustchain = { path = "trustchain", features = ["localhost-testing"] }
blockmatrix = { path = "blockmatrix" }
hypermesh-lib = { workspace = true }

[features]
default = ["blockmatrix-full", "high-performance"]

# Complete BlockMatrix stack
blockmatrix-full = ["stoq-transport", "blockmatrix-assets", "trustchain-authority"]

# Individual layers (for testing/development)
stoq-transport = []
blockmatrix-assets = []
trustchain-authority = []

# Performance optimizations
high-performance = ["hardware-acceleration", "zero-copy"]
hardware-acceleration = []
zero-copy = []

# Deployment modes
production = ["blockmatrix-full", "high-performance", "proof-of-state-mandatory"]
development = ["blockmatrix-full", "legacy-compatibility"]
proof-of-state-mandatory = []
legacy-compatibility = []
future-tests = []

# [[bin]]
# name = "blockmatrix-server"
# path = "src/main.rs"


# [[bench]]
# name = "protocol_stack"
# harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"

[profile.dev]
opt-level = 1
# `debug = true` emitted full DWARF into every one of the workspace's ~97
# integration-test binaries. Each tests/*.rs file links the WHOLE dependency
# tree (quinn, rustls, FALCON, Kyber, reed-solomon) into a standalone binary,
# so full debug info is paid ~97 times over. That is what produced a 354 GB
# target tree on a 1.8 TB disk and starved the machine of I/O.
#
# line-tables-only keeps file:line in every backtrace and panic — which is how
# this project actually debugs (test output, not a stepping debugger). What is
# given up is variable inspection under gdb/lldb.
debug = "line-tables-only"
# Keep debug info in separate object files rather than copying it into every
# linked binary. Linux-only; the 97 binaries stop each carrying their own copy.
split-debuginfo = "unpacked"
panic = "unwind"

# Dependencies do not need debug info at all — we never step into quinn or
# rustls. They are also built once and reused, so optimising them costs nothing
# per-rebuild and makes the test suite meaningfully faster.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.bench]
inherits = "release"
debug = true

[workspace.lints.rust]
missing_docs = "allow"
