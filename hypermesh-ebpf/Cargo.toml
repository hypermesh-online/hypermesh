[package]
name = "hypermesh-ebpf"
version = "0.1.0"
edition = "2021"
authors = ["HyperMesh Team"]
description = "HyperMesh eBPF Intelligence Layer - THE single source of truth for all eBPF code"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
# Shared types (single source of truth)
hypermesh-lib = { workspace = true }

# Async runtime (for AF_XDP socket operations and validation hooks)
tokio = { workspace = true }
async-trait = { workspace = true }

# Zero-copy packet I/O
bytes = { workspace = true }

# Core serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Hashing for validation
blake3 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Data structures
parking_lot = { workspace = true }

# -----------------------------------------------------------------------
# Linux-only deps: aya/libbpf-sys/libc require Linux kernel headers and
# will not link on macOS/Windows. Phase C.2: target-gate so non-Linux
# can compile the userspace-only HyperMeshEbpf API surface.
# -----------------------------------------------------------------------
[target.'cfg(target_os = "linux")'.dependencies]
# eBPF infrastructure (Linux kernel BPF integration)
aya = "0.12"
aya-log = "0.2"
libbpf-sys = "1.4"

# System calls (AF_XDP socket probing behind kernel-attach)
libc = { version = "0.2", optional = true }

[build-dependencies]
# No external build deps needed; build.rs uses only std + Command

[features]
default = []
# Feature for enabling actual eBPF program loading and XDP attachment (requires privileges)
kernel-attach = ["libc"]
# Feature for compiling eBPF programs from C source (requires clang)
ebpf-loader = []

[lib]
name = "hypermesh_ebpf"
path = "src/lib.rs"
