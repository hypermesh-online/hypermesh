[crate]
name = "Caesar"
id = "caesar"
description = "Gold-denominated Ephemeral Value Protocol for HyperMesh"
phase = "alpha"

[features.working]
items = [
    # EVP core (real state machine, real math, real conservation invariant)
    "EVP core types (PacketId, GoldGrams, MarketTier, PacketState with 11 states, DemurrageRate)",
    "CaesPacket state machine (Minted->InTransit->Delivered->Settling->Settled, plus Hold/Stall/Expire/Refund/Dissolve/Disperse)",
    "Tier-based demurrage decay (L0 ~5%/hr, L1 ~0.1%/day, L2 ~0.01%/day, L3 ~0.001%/day)",
    "Governor PID controller (velocity, gold deviation, volume, liquidity, in-transit float)",
    "Constitutional fee caps (L0=5%, L1=2%, L2=0.5%, L3=0.1%)",
    "Network pressure classification (6 quadrants)",
    "Universal Payment Interface — IngressAdapter + EgressAdapter traits with 4 finality types",
    "Settlement protocol — validate, settle, split_rewards (80/20 egress/transit)",
    "Acceptance criteria — per-recipient preferences structure",
    "Gravity dissolution — 90-day timeout, 6-criteria qualification, weighted distribution",
    "Fee distribution — 80/20 egress/transit split, bytes-weighted transit allocation",
    "Gold oracle — price tracking, 10% band validation, grams/USD conversion",
    "Effective price composite (network fees + speculation pressure - liquidity shadow)",
    "Capacity-based packet routing (bandwidth/buffer/latency/load scoring)",
    "Holding buffer — orbit buffer for fee-budget-exceeded/congestion packets",
    "Packet-centric storage (PacketRecord, SettlementRecord, JSON persistence)",
    "CaesarProtocol coordinator (storage + processor + distributor + oracle + router + governor)",
    "Conservation law verification + circuit breaker",
    "MeshCredit UPI adapter (internal ledger, 1:1 CAES denomination)",
    "OracleFeed trait for pluggable gold price sources (ManualFeed for alpha)",
    "Node status tracking in storage (settled count, fee earnings)",
    "STOQ API handlers wired to real CaesarProtocol (5 handlers over QUIC)",
    "Caesar binary CLI (--bind, --service-name, STOQ API server launcher)",
    "Cross-chain bridge trait (InternalBridge with conservation checks)",
    "UI-facing API handlers — /wallet, /balance, /transactions, /rewards, /staking, /exchange/rates, /analytics/overview, /analytics/earnings (8 handlers matching UI TypeScript interfaces)",
]

[features.in_development]
items = [
    # Caesar works in-memory on a single node, but has no real external integration
    "Multi-node packet routing — routing logic exists but packets don't actually traverse QUIC connections between nodes",
    "Blockchain-backed acceptance criteria — currently in-memory, should be on Network chain",
    "Engauge capacity metrics integration — feature-gated code exists but no real data pipeline",
    "Banking interop bridge — 3 tests failing, external adapter not functional",
]

[features.planned]
items = [
    "Live multi-chain UPI bridge BTC/ETH/SOL (blocked by: chain SDK deps)",
    "External fiat/crypto payment rail integrations (blocked by: external API keys + compliance)",
    "Real gold oracle data feed (blocked by: external API subscription)",
]
