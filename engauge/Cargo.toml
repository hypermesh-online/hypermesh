[package]
name = "engauge"
version.workspace = true
edition = "2021"
authors = ["HyperMesh Team"]
description = "Work tracking, content receipts, and capacity metrics for HyperMesh"
license = "MIT OR Apache-2.0"

[dependencies]
hypermesh-lib = { path = "../lib" }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.35", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
blake3 = "1.5"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
bytes = { version = "1.6", features = ["serde"] }
reed-solomon-erasure = "6.0"
hex = "0.4"
serde_bytes = "0.11"

# Server binary dependencies (optional to avoid stoq<->engauge cycle)
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs", "prefer-post-quantum"], optional = true }
rcgen = { version = "0.13", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
server = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tracing-subscriber"]

[[bin]]
name = "engauge-server"
path = "src/bin/engauge_server.rs"
required-features = ["server"]
