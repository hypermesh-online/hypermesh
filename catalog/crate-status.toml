[crate]
name = "Catalog"
id = "catalog"
description = "Asset package registry and template library"
phase = "alpha"

[features.working]
items = [
    # Package management (real data structures, local operations)
    "Asset package types and metadata",
    "Asset registry with typedef registration and search",
    "Template generation framework",
    "Semantic versioning",
    "Scripting engine (syntax validation only — no execution)",
    "Asset SDK (clean public API facade)",
    "Typedef registry marketplace (browsing, multi-factor search scoring)",
    "Binary publisher authentication (interface only — PoS validation is fake)",
    "BLAKE3 content hashing",
    "DHT distribution — local data structures (XOR-distance routing, k-bucket management, value store)",
    "Dependency resolution (topological sort, transitive resolution, circular detection)",
    "Dashboard manifest types (DashboardManifest parse/validate, shared with blockmatrix)",
    "Asset validation pipeline (size limits, BLAKE3 hash verification, metadata completeness)",
    "catalog.hypermesh.online STOQ API endpoint (6 handlers over QUIC)",
    "Catalog server binary stability (standalone STOQ API — LRU cache OOM bug fixed)",
    "DHT store/query over STOQ transport",
    "STOQ API handlers wired to CatalogRegistry",
    "Real FALCON-1024 signature verification",
    "X.509 certificate parsing for publisher info",
    "TrustChain certificate validation (real expiry/revocation)",
    "Policy rule evaluation (CertificateIssuer)",
    "foundation.dns_grant/v1 typedef hosted",
    "release.feed/v1 typedef hosted (Phase J.1 — foundation-signed release announcements: version, channel, per-target binary hashes, release notes URL, FALCON-1024 signature)",
    # Phase M.4 — registry dependency graph + provider seam
    "Registry dependency resolution — CatalogRegistry::resolve_dependencies runs a cycle-safe BFS producing DependencyGraph { direct, transitive, missing } with honest missing-tracking (unregistered hashes surfaced, no fabricated graph)",
    "Embedded typedef-reference scanner — schema_scanner::scan_schema_for_typedef_refs regex-scans a typedef schema body for 64-hex BLAKE3 refs that resolve to registered typedefs, unioning implicit deps with declared ones",
    "CatalogProvider trait + blockmatrix adapter — CatalogRegistryAdapter/wire_catalog_registry expose the registry to blockmatrix via a dyn-safe provider (resolves the catalog→blockmatrix dependency cycle); catalog.dependencies IPC handler is backed by the real BFS when a registry is present, honest alpha-inert when absent",
]

[features.in_development]
items = [
    "Caesar contribution reward integration — CatalogRewardAdapter exists but no real Caesar EVP connection",
    "Peer-to-peer sharing — announce/discover code exists but local-only until DHT remote I/O is wired",
    "HyperMesh execution delegation — allocate/query/terminate lifecycle code exists but no real remote execution",
    "Shared asset library — browse and install packages across nodes on the public network",
]

[features.planned]
items = []
