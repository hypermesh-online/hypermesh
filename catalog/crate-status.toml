[crate]
name = "Catalog"
id = "catalog"
description = "Asset package registry and template library"
phase = "alpha"

[features.working]
items = [
    "Asset package types and metadata",
    "Asset registry with typedef registration and search (legacy publish/install are migration stubs)",
    "Template generation framework",
    "Semantic versioning",
    "Scripting engine (syntax validation)",
    "STOQ transport for distribution",
    "TrustChain security integration (FALCON-1024 cert lifecycle)",
    "Proof of State validation for packages",
    "Asset SDK (clean public API facade)",
    "Typedef registry marketplace (browsing, multi-factor search scoring, featured listings)",
    "Caesar contribution reward integration (CatalogRewardAdapter, ContributionTracker)",
    "catalog.hypermesh.online STOQ API endpoint (browse/search/package/publisher/stats/health)",
    "Binary publisher authentication (whitepaper-aligned, no reputation scoring)",
    "BLAKE3 content hashing (whitepaper-aligned)",
    "DHT distribution — local data structures (XOR-distance routing table, k-bucket management, stale eviction, value store; remote node I/O pending STOQ transport wiring)",
    "Dependency resolution (topological sort, transitive resolution, circular dependency detection, conflict detection)",
    "Asset validation pipeline (size limits, BLAKE3 hash verification, metadata completeness, type-specific: WASM magic bytes, JSON parse)",
    "Peer-to-peer sharing wired to DHT (announce via BLAKE3 key, discover with text search fallback; local-only until DHT remote I/O is wired)",
    "HyperMesh execution delegation (allocate/query/terminate lifecycle, resource validation, status tracking)",
]

[features.in_development]
items = [
    "Catalog server binary — standalone STOQ API server (catalog.hypermesh.online) with browse/search/publish/install endpoints",
    "DHT remote I/O — wire store_value_on_node/query_value_from_node to real STOQ transport for cross-node package discovery",
    "Shared asset library — browse and install packages across nodes on the public network",
]

[features.planned]
items = [
]
