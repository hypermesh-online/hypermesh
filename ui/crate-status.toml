[crate]
name = "HyperMesh UI"
id = "ui"
description = "React dashboard for HyperMesh ecosystem monitoring and management"
phase = "alpha"

[features.working]
items = [
    "Dashboard home with ecosystem overview",
    "Module pages (STOQ, TrustChain, Catalog, Caesar, Engauge, HyperMesh)",
    "Component library (Radix UI primitives, Tailwind 4)",
    "Chart system (Line, Bar, Pie, Area, Gauge, Sparkline, Topology, Network)",
    "TrustChain management (certificates, security, consensus, node config)",
    "Asset management views (creation wizard, advanced management)",
    "Proxy and NAT address management",
    "API status monitoring and performance dashboards",
    "Global search across ecosystem modules",
    "Storybook component documentation (5 stories)",
    "Accessibility wrappers and keyboard navigation",
    "React Router page routing with sidebar navigation",
    "E2E test suite (Playwright, 5 specs: dashboard, navigation, module-pages, accessibility, trustchain)",
    "Integration test harness page",
]

[features.in_development]
items = [
    "STOQ native demo (WebAssembly integration — StoqWasmClient, useStoqNative hook, wasm stubs)",
    "Component unit tests (Vitest, 3 test files + 3 test utilities = 6 total)",
]

[features.planned]
items = [
    "Live STOQ WebSocket data connections",
    "Real-time metrics streaming",
    "Multi-node cluster topology visualization",
    "Security monitoring with live alerts",
    "Native desktop dashboard (Tauri cross-platform: Linux/macOS/Windows)",
    "Caesar wallet and transaction management UI",
    "Engauge analytics and reward distribution dashboard",
    "Remote device/resource/asset management hub (Tailscale-like C&C for sovereign nodes)",
    "Private network remote access (manage resources across networks from any device)",
    "First-run onboarding flow (sovereign node setup, network join, resource configuration)",
    "New node registration experience (not traditional sign-up — sovereign identity bootstrap)",
]
