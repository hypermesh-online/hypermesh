[package]
name = "hypermesh-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI bindings for HyperMesh SDK"
license = "BSL-1.1"

[lib]
name = "hypermesh_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
hypermesh-sdk = { path = "../hypermesh-sdk" }
# Direct (daemon-less) C ABI over the SAME validated Rust paths:
# - hypermesh-lib: AssetAddress + BLAKE3 content-hash mirror invariant
# - trustchain: FALCON-1024 identity, cert primitives, PoS-signed proof verify
hypermesh-lib = { workspace = true }
trustchain = { path = "../trustchain" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
libc = "0.2"

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
tempfile = { workspace = true }
