[crate]
name = "HyperMesh FFI"
id = "hypermesh-ffi"
description = "C FFI bindings for the HyperMesh SDK — foundation for TypeScript, Go, Python, C/C++, C# integrations"
phase = "alpha"

[features.working]
items = [
    "Opaque client handle (hypermesh_connect/disconnect with tokio runtime)",
    "Raw JSON-RPC call (hypermesh_call — any IPC method accessible from C)",
    "Thread-local error state (hypermesh_last_error, set on failure)",
    "Memory management (hypermesh_free_string for caller-owned strings)",
    "Node API (hypermesh_status)",
    "DNS API (hypermesh_dns_resolve, dns_list, dns_register)",
    "Network API (hypermesh_peers)",
    "Blockchain API (hypermesh_blockchain_height, blockchain_block)",
    "Topology API (hypermesh_topology_info)",
    "Asset API (hypermesh_asset_list, asset_store, asset_fetch)",
    "Domain API (hypermesh_domain_list, domain_register)",
    "Dashboard API (hypermesh_dashboard_list, dashboard_deploy)",
    "Config API (hypermesh_config_show, config_get)",
    "C header file (include/hypermesh.h with extern C guards)",
    "NULL-safe — all functions handle NULL client gracefully",
    # Direct (daemon-less) C ABI over the same validated Rust paths
    "Direct Identity ABI (hypermesh_identity_generate/load/free/node_id/public_key/kyber_public_key/sign)",
    "Direct signature verify (hypermesh_verify_signature — stateless FALCON-1024)",
    "Direct PoS proof verify (hypermesh_signed_proof_verify — WireSignedProof envelope, preserves PoS gate)",
    "Direct AssetAddress ABI (new/to_ipv6/from_ipv6/fingerprint/coords/shard_index/is_hypermesh)",
    "Direct content-hash mirror invariant (hypermesh_compute_content_hash/hypermesh_verify_content_hash — BLAKE3, R4)",
    "cbindgen-generated header (build.rs + cbindgen.toml regenerate include/hypermesh.h)",
    "catch_unwind at every direct-ABI boundary; opaque handles with matching free fns",
    "C smoke test (tests/smoke.c + run_smoke.sh) links staticlib and exercises the direct ABI",
    # Phase P9.2 — in-process publish/verify PoS seam (byte-level FALCON, no secret across the boundary)
    "hypermesh_publish (identity, bytes, len) — emits BLAKE3[32] content address AND a serialized WireSignedProof whose FALCON-1024 signature is over BLAKE3(proof_bytes||nonce), byte-identical to TrustChainProofProvider::generate_proof (NOT a signature over the raw asset bytes); reuses NodeSigner::sign + compute_blake3_hash, no reimplemented crypto",
    "hypermesh_verify_proof (wire_proof, len) — verify-only, mirrors TrustChainProofProvider::validate_proof; holds no key and cannot mint a valid proof",
    "hypermesh_falcon_signature_max_len() = 1280 (PQClean FALCON-1024 authoritative sig length) for caller buffer sizing",
    "SECURITY-CRITICAL FALCON seam — the FALCON secret key lives only inside the opaque hypermesh_identity_t handle and NEVER crosses the C ABI boundary; publishing requires the handle, verification is keyless",
    # Per-service FFI functions (route through IPC daemon)
    "Caesar API (hypermesh_caesar_wallet, balance, transactions, rewards, route_packet, governor_params)",
    "TrustChain API (hypermesh_trustchain_certificates, issue, validate, revoke, dns_zones)",
    "Engauge API (hypermesh_engauge_capacity, traffic, marketplace, node_metrics, leases)",
    "Catalog API (hypermesh_catalog_browse, search, package_info, registry_stats)",
    # Language FFI loaders (wrapping the C FFI for each language)
    "TypeScript FFI loader (ffi-napi + ref-napi, optional dependency)",
    "Python FFI loader (ctypes wrapper with library discovery)",
    "C# FFI loader (P/Invoke with cross-platform NativeLibrary resolver)",
    "Go FFI loader (cgo wrapper with build tag)",
    "C++ FFI loader (direct linking via FfiClient class + CMake target)",
]

[features.in_development]
items = []

[features.planned]
items = []
