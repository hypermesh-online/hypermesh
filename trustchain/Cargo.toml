[package]
name = "trustchain"
version = "0.1.0"
edition = "2021"
authors = ["Web3 Ecosystem Team"]
description = "TrustChain - Certificate Authority with Certificate Transparency and DNS resolution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/web3-ecosystem/trustchain"
keywords = ["ca", "certificate", "transparency", "dns", "proof-of-state"]

[lints]
workspace = true

[dependencies]
# Shared types (single source of truth)
hypermesh-lib = { workspace = true }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# STOQ transport integration (replaces direct QUIC)
stoq = { path = "../stoq", features = ["high-performance"] }
bytes = { workspace = true }

# Certificate and cryptography
x509-parser = { workspace = true }
der-parser = { workspace = true }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
# rsa = { workspace = true }  # REMOVED: RUSTSEC-2023-0071 - Using FALCON-1024 instead
pem = { workspace = true }
der = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }

# Post-quantum cryptography
pqcrypto-falcon = { workspace = true }
pqcrypto-kyber = { workspace = true }
pqcrypto-traits = { workspace = true }
aes-gcm = { workspace = true }
falcon-rust = "0.1"  # Alternative FALCON implementation
serde_arrays = "0.1"  # For serializing fixed-size arrays

# HTTP client (for bootstrap testing only)
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"], optional = true }

# Compression
flate2 = { workspace = true }

# Web and API
# axum = ... # REMOVED: STOQ-only transport
# tower = ... # REMOVED: STOQ-only transport (HTTP middleware)
# tower-http = ... # REMOVED: STOQ-only transport
# hyper = ... # REMOVED: STOQ-only transport

# DNS (trust-dns only — hickory is the same project renamed, removed duplicate)
trust-dns-client = { workspace = true }
trust-dns-proto = { workspace = true }
# trust-dns-server = ... # REMOVED: zero usage in codebase
# hickory-client = ... # REMOVED: hickory IS trust-dns renamed, duplicate deps
# hickory-proto = ... # REMOVED: hickory IS trust-dns renamed, duplicate deps

# Data structures and serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }

# State proof and blockchain
sha2 = { workspace = true }
hkdf = "0.12"
blake3 = { workspace = true }
merkletree = { workspace = true }

# Storage and data management
dashmap = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
once_cell = "1.19"

# Error handling and logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }
num_cpus = { workspace = true }
time = { version = "0.3", features = ["macros", "formatting"] }

# Configuration
clap = { workspace = true }

# IPv6 networking
socket2 = { workspace = true }

# HTTP/3 support
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { workspace = true }
http = "1.1"

# Additional
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
serial_test = "3"

[features]
default = ["ca", "ct", "dns", "proof-of-state", "localhost-testing", "http-bootstrap"]

# Core features
ca = []                # Certificate Authority
ct = []                # Certificate Transparency
dns = []               # DNS resolution
proof-of-state = []    # Proof of State validation integration

# Testing and development
localhost-testing = []
http-bootstrap = ["dep:reqwest"]  # Only needed by trustchain-bootstrap binary
production-ready = ["proof-of-state"]

[lib]
name = "trustchain"
path = "src/lib.rs"


[[bin]]
name = "trustchain-bootstrap"
path = "src/bin/trustchain_bootstrap.rs"

[[bin]]
name = "trustchain-stoq-server"
path = "src/bin/trustchain-stoq-server.rs"

[[bin]]
name = "validate-deployment"
path = "src/bin/validate-deployment.rs"

[[bin]]
name = "trustchain-http3-server"
path = "src/bin/trustchain-http3-server.rs"

[[bin]]
name = "trustchain_ca"
path = "src/bin/trustchain_ca.rs"

[[bench]]
name = "certificate_bench"
harness = false

# Profiles are managed at workspace level