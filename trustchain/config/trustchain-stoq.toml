# Written by Richard Christopher, Copyright 2026 HyperMesh Foundation
#
# TrustChain STOQ CA (node-to-node certificates).
# Schema-valid for TrustChainConfig::load() (serialized from
# TrustChainConfig::production() with explicit production [api]).
# F9: production-clean CA. api.port=8445 (distinct from the http3 CA on
# 8444 to avoid collision). TLS on; four-proof production bar.
[ca]
ca_id = "trustchain-ca-production"
bind_address = "::"
port = 8443
cert_validity_days = 1
mode = "Production"

[ca.rotation_interval]
secs = 86400
nanos = 0

[ca.state_requirements]
minimum_stake = 50000
minimum_storage = 10737418240
minimum_compute = 10000

[ca.state_requirements.max_time_offset]
secs = 30
nanos = 0

[ca.hypermesh_client_config]
max_retries = 5
enable_caching = true

[ca.hypermesh_client_config.request_timeout]
secs = 60
nanos = 0

[ca.hypermesh_client_config.retry_backoff]
secs = 1
nanos = 0

[ca.hypermesh_client_config.cache_ttl]
secs = 600
nanos = 0

[ct]
log_id = "trustchain-ct-production"
bind_address = "::"
port = 6962
max_entries_per_shard = 10000000
storage_path = "/var/lib/trustchain/ct"
enable_realtime_fingerprinting = true

[ct.merkle_update_interval]
secs = 30
nanos = 0

[ct.state_requirements]
minimum_stake = 50000
minimum_storage = 10737418240
minimum_compute = 10000

[ct.state_requirements.max_time_offset]
secs = 30
nanos = 0

[dns]
server_id = "trustchain-dns-production"
bind_address = "::"
quic_port = 8853
port = 53
upstream_resolvers = [
    "2001:4860:4860::8888",
    "2606:4700:4700::1111",
]
enable_cert_validation = true
trustchain_domains = [
    "hypermesh",
    "caesar",
    "trust",
    "assets",
    "catalog",
    "engauge",
]

[dns.cache_ttl]
secs = 600
nanos = 0

[dns.state_requirements]
minimum_stake = 50000
minimum_storage = 10737418240
minimum_compute = 10000

[dns.state_requirements.max_time_offset]
secs = 30
nanos = 0

[api]
server_id = "trustchain-stoq-api-production"
bind_address = "::"
port = 8445
enable_tls = true
rate_limit_per_minute = 300
max_body_size = 10485760
cors_origins = [
    "https://hypermesh.online",
    "https://trust.hypermesh.online",
]

[api.state_requirements]
minimum_stake = 50000
minimum_storage = 10737418240
minimum_compute = 10000

[api.state_requirements.max_time_offset]
secs = 30
nanos = 0

[network]
ipv6_only = true
max_concurrent_connections = 1000

[network.connection_timeout]
secs = 30
nanos = 0

[network.keep_alive_interval]
secs = 60
nanos = 0

[network.tls]
min_version = "1.3"
cipher_suites = [
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "TLS_AES_128_GCM_SHA256",
]
cert_validation = "AllowSelfSigned"

[logging]
level = "info"
format = "json"
structured = true

[logging.output.file]
path = "/var/log/trustchain/trustchain.log"
