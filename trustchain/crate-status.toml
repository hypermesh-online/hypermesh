[crate]
name = "TrustChain"
id = "trustchain"
description = "FALCON-1024 Certificate Authority with Proof of State validation"
phase = "alpha"

[features.working]
items = [
    "FALCON-1024 post-quantum signing",
    "Kyber-1024 key encapsulation",
    "Proof of State four-proof validation",
    "Security monitoring and Byzantine detection",
    "DNS resolver (programmatic resolution works, HTTP/3 endpoint wired, STOQ transport client not fully integrated)",
    "STOQ-based API server",
    "SecurityIntegratedCA with mandatory consensus and real metrics",
    "Binary PoS authentication (whitepaper-aligned, no scoring/reputation)",
    "StateAuthenticator (renamed from ConsensusValidator)",
    "BLAKE3 consensus content hashing",
    "OCSP responder with FALCON-1024 signed responses",
    "CRL generator and distributor",
    "Threshold cryptography (Shamir SSS over GF(256))",
    "Deployment quality gates",
    "Cross-network CA federation (peer management, trust levels, FALCON-1024 cross-validation)",
    "CT log federation sync protocol (message types, peer state tracking, consistency proofs)",
    "Anonymous mode ephemeral certificates (Tor-like tunnel certs, no CA/CT)",
    "Certificate rotation (CertificateRotationManager scans store, rotates expiring certs)",
    "Persistent revocation storage (JSON on disk, survives restart)",
    "Canonical ProofType from hypermesh-lib (single source of truth)",
    "Cross-crate identity integration (AuthenticatedNode wraps lib::NodeId, to_scoped_identity() bridge)",
    "Workload identity types (NodeIdentity, ServiceIdentity, AgentIdentity)",
    "Identity-typed certificates (CertificateSubjectType: Node/Service/Agent)",
    "Identity-scoped certificate extensions (IdentityScopeExtension, OID-based, 4-byte encode/decode)",
    "TrustAssetKind includes Transmission variant (R10 alignment with SystemAssetKind)",
    "CA-signed leaf certificates (rcgen signed_by() chain, proper X.509 hierarchy)",
    "Certificate PEM encoding (rcgen .pem() output, proper base64)",
    "Certificate Transparency (Merkle tree with consistency checker, inclusion proofs, cert hash search)",
    "KeyUsage/EKU enforcement in issued X.509 certs (digital signature, key encipherment, server/client auth by subject type)",
    "Threshold crypto integration with CA initialization (Shamir SSS key splitting at startup)",
    "Scope-aware certificates (IdentityScopeExtension embedded via custom OID, Device vs Network scope)",
    "Certificate lifecycle tied to scope (Anonymous=minutes, Private=days, Public=months validity)",
    "Real certificate operation metrics (CAMetrics atomic counters: issued, revoked, validation/issuance latency)",
    "HTTP/3 handlers: list_certificates wired to real cert store",
    "Cascading revocation (parent→child BFS propagation, multi-level cascade)",
    "Distributed revocation propagation (federation broadcast, BLAKE3 integrity, status tracking)",
    "CRL distribution via blockchain (hash-linked blocks, full + delta CRLs, chain integrity verification)",
    "Offline device grace period renewal (scope-dependent: Anonymous=0, Private=7d, Public=30d, max renewals enforced)",
    "Field device bootstrap with intermittent connectivity (Provisional→Enrolling→Enrolled, retry limits)",
    "HTTP/3 handlers wired (consensus_status, consensus_validate with ProofValidation, auth_certificate with CA issuance)",
]

[features.in_development]
items = [
    "Production binary hardening — config file loading, graceful shutdown, health endpoint, signal handling",
    "Let's Encrypt / ACME cert bootstrap for trust.hypermesh.online gateway TLS (initial clearnet bootstrap before self-issued FALCON certs)",
]

[features.planned]
items = [
]
