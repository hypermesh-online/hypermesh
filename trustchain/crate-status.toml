[crate]
name = "TrustChain"
id = "trustchain"
description = "Certificate Authority with Proof of State validation — currently single-node, target: decentralized"
phase = "alpha"

[features.working]
items = [
    # Certificate generation (real X.509, but NOT post-quantum yet)
    "X.509 certificate issuance via rcgen (real CA-signed leaf certs, proper hierarchy)",
    "Certificate PEM encoding (rcgen .pem() output, proper base64)",
    "KeyUsage/EKU enforcement in issued certs (digital signature, key encipherment, server/client auth)",
    "Certificate Transparency (Merkle tree with consistency checker, inclusion proofs)",
    "Certificate rotation (CertificateRotationManager scans store, rotates expiring certs)",
    "Persistent revocation storage (JSON on disk, survives restart)",
    "OCSP responder structure",
    "CRL generator and distributor structure",
    # Identity types (real type system)
    "Workload identity types (NodeIdentity, ServiceIdentity, AgentIdentity)",
    "Identity-typed certificates (CertificateSubjectType: Node/Service/Agent)",
    "Cross-crate identity integration (AuthenticatedNode wraps lib::NodeId)",
    "TrustAssetKind includes Transmission variant (R10)",
    "StateAuthenticator (binary PoS authentication interface)",
    "FALCON-1024 node identity (FalconIdentity implements NodeSigner trait, keypair gen, persistence, BLAKE3 node ID — canonical implementation used by blockmatrix)",
    "Key rotation entries — KeyRotationEntry with FALCON-signed transition proof, old key signs new key authorization, rotation chain verification (genesis → current)",
    "Recovery passphrase commitment — HKDF-SHA512 + BLAKE3 deterministic commitment stored in genesis Identity asset, passphrase never persisted",
    "TrustChainProofProvider — implements StateProofProvider with FALCON-1024 signed WireSignedProof envelope (BLAKE3+FALCON signing/verification, replay-prevention nonce)",
    "FALCON-1024 identity signing — bilateral handshake proofs are FALCON-signed end-to-end (generate→sign→wire→verify), StakeProof covered by WireSignedProof envelope",
    "FALCON IS authentication — QUIC/TLS provides transport encryption only (AcceptAllVerifier bypasses cert verification), PoS bilateral handshake with FALCON-signed proofs is the sole authentication mechanism",
    "BLAKE3 content hashing",
    "Canonical ProofType from hypermesh-lib",
    "Production binary hardening (config file loading from TRUSTCHAIN_CONFIG env / ~/.hypermesh/trustchain.toml, graceful shutdown on SIGTERM/SIGINT, health endpoint, signal handling)",
    # DNS zones (config entries, not propagated)
    "Production DNS zone config for catalog.hypermesh.online and ngauge.hypermesh.online",
    # Metrics
    "Real certificate operation metrics (CAMetrics atomic counters: issued, revoked, latency)",
    "Real PoS bilateral verification on peer connections",
    "PoS-gated CA certificate issuance",
    "CA federation with PoS-validated peers",
    "FALCON-1024 certificate signing in STOQ",
    # Threshold CA (L2) + Distributed CA (L3)
    "Threshold CA activation — split_ca_key() + sign_with_threshold() wire Shamir SSS into TrustChainCA",
    "FederationManager key share storage — store/get/remove/list KeyShares with fingerprint validation",
    "CRL propagation to federation — CrlDistributor.propagate_to_federation() pushes revocations to Full+Conditional peers; with FederationOcspTransport attached, actually delivers over wire",
    "OCSP federated check — federated_check() queries local store first; with FederationOcspTransport attached, polls Full/Conditional peers and returns Revoked on first hit, Unknown when all peers Unknown",
    # Phase F.1 — CA Federation Activation (2026-05-07)
    "ThresholdSignCoordinator — broadcasts share-request via FederationTransport, awaits t-of-n responses with deadline, calls reconstruct_and_sign for FALCON-1024 signature",
    "TrustSignalProvider trait — pluggable ngauge-driven trust gating in FederationManager.add_peer_with_proof",
    "ngauge-gated TrustLevel demotion — peers with low ActivityScore/CapacityMetrics demoted to Conditional; ByzantineDetector flag forces Untrusted",
    "trustchain.request_cert IPC handler — routes through ThresholdSignCoordinator if federation in threshold mode, else local FALCON-1024 self-sign fallback",
    # Phase F.2 — OCSP + CRL Federation (2026-05-07)
    "OCSP HTTP/3 endpoint with federation fallback — POST /api/v1/trustchain/ocsp serves real OcspResponder; on local Unknown, falls back to FederationOcspTransport peer queries when attached",
    "CRL revocation auto-propagates to federation — CertificateStore.revoke_certificate calls CrlDistributor.propagate_to_federation when set_federation() context attached, alpha-default unchanged otherwise",
    "Cross-CA cert validation — FederationManager.is_federation_signed verifies FALCON-1024 cert blob against any Full/Conditional peer's public key, rejects unknown signers and Untrusted peers",
    "STOQ TAG_CRL_REQUEST/RESPONSE wire constants (0x33/0x34) and trustchain/crl/lookup STOQ API path — CrlLookupHandler exposes is_revoked + reason for federation peers",
    # Phase F2 — handshake signer binding (zero-trust hardening)
    "Unsigned-proof fallback REMOVED — TrustChainProofProvider::validate_proof default-rejects any proof that is not a FALCON-signed WireSignedProof (the legacy raw-StateProof downgrade path is deleted, no structural-only accept)",
    "Signer↔identity binding — WireSignedProof::signer_matches / signer_pubkey_bytes let the bilateral handshake enforce that the proof signer is the same FALCON key that authenticated the peer identity (BLAKE3(pubkey)==node_id), closing the self-signed-proof Sybil vector",
    # Phase F3 — test proofs excluded from release
    "localhost-testing removed from default features — release builds cannot enter StateProof::new_for_testing into real blocks; the feature is dev/test-only via resolver-2 dev-dependency scoping",
    "trustchain_ca gated behind required-features=[\"localhost-testing\"] — the self-signed auto-issue dev CA is excluded from release builds",
    # Phase F9 — dual-CA production split (deployed + verified live on trust.hypermesh.online)
    "Dual-CA production split — trustchain-http3-server ([::1]:8444, gateway/clearnet CA) + trustchain-stoq-server ([::1]:8445, node-to-node CA), two production-clean binaries (zero new_for_testing), each loading a production State-bar [api] config; the production CA no longer runs the test-proof binary",
    # Phase P2 — device-authentication invariant
    "Device fingerprint folded into all four genesis proofs — DeviceFingerprint (machine-id/DMI/disk-serial/MAC via OsAbstraction) contributes to PoSpace/PoStake/PoWork/PoTime; three node-ids collapsed to one (BLAKE3(falcon_pubkey))",
    "Real PoTime clock witness — perform_ntp_sync returns a genuine wall-vs-monotonic drift reading with an epoch-window sanity check, not a hardcoded constant",
]

[features.in_development]
items = [
    # CERTIFICATES: Dual cert model — rcgen X.509 for TLS (required by rustls/Quinn), FALCON for PoS identity
    "Post-quantum TLS signatures — FALCON not usable for X.509 cert signing (TLS 1.3 only supports RSA/ECDSA/EdDSA in rustls). QUIC key exchange IS post-quantum via X25519MLKEM768 (aws-lc-rs)",
    "Kyber-1024 KEM integration — type exists but not used in certificate operations",
    "Certificate lifecycle tied to scope — scope-aware duration fields defined but not enforced in CA flow",
    "Scope-aware certificates — IdentityScopeExtension type defined but not embedded in issued certs",
    # IDENTITY: peer discovery
    "Peer discovery (mDNS) — PeerAnnouncement struct exists, not tested multi-node",
    # API: incomplete integration
    "STOQ-based API server — binds [::1]:8444, handler-to-cert-store wiring not fully verified",
    "HTTP/3 handlers — exist but real cert operation flow not tested end-to-end",
    # DECENTRALIZATION: Single-node only
    "Byzantine detection — ByzantineDetector monitors local node only",
    "Let's Encrypt / ACME cert bootstrap for trust.hypermesh.online gateway TLS",
    # PROOF DEPTH: authenticity is at the envelope, inner proofs are structural
    "Inner four-proof depth — StakeProof/SpaceProof/WorkProof/TimeProof ::validate() is STRUCTURAL (non-empty holder id, positive stake, age/epoch bounds), NOT signature/threshold-verifying; cryptographic authenticity is only the FALCON-1024 WireSignedProof envelope over the serialized StateProof. Deep per-proof threshold checks (real stake/storage/compute attestation) not yet enforced on hot paths",
    "Device-continuity enforcement is opt-in — verify_device_continuity rejects a copied identity on a different machine only under --require-hardware-auth (defaults off)",
]

[features.planned]
items = [
    "CRL distribution via blockchain (hash-linked blocks, delta CRLs)",
    "Cascading revocation across federated CAs",
    "Offline device grace period renewal",
    "Field device bootstrap with intermittent connectivity",
    "Recovery execution — passphrase-based key recovery, threshold peer attestation (k-of-n), Shamir key backup distribution (§6.2.3)",
    "Rotation chain verification wired into bilateral PoS handshake — peers verify key continuity on reconnect",
    "Identity distribution — key rotation entries propagated to peers via block sync, rotation alerts for theft detection (§6.2.4)",
]
