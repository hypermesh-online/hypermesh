[package]
name = "blockmatrix"
version.workspace = true
edition = "2021"
authors = ["HyperMesh Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hypermesh/hypermesh"
description = "HyperMesh - Distributed Computing Platform with Proof of State"
autobins = false

[lints]
workspace = true

[lib]
name = "blockmatrix"
path = "src/lib.rs"

[[bin]]
name = "hypermesh"
path = "src/bin/node/main.rs"

[[example]]
name = "car_purchase"
path = "examples/car_purchase.rs"

[[example]]
name = "multi_network_coordinator"
path = "examples/multi_network_coordinator.rs"

[[bench]]
name = "basic_benchmark"
harness = false

[[bench]]
name = "tensor_bench"
harness = false

[[bench]]
name = "phase1_bench"
harness = false

[[bench]]
name = "transfer_bench"
harness = false

[[bench]]
name = "retrieval_bench"
harness = false

[dependencies]
# Shared types (single source of truth)
hypermesh-lib = { workspace = true }

# Substrate (link/carrier/address floor). blockmatrix consumes base's ONE
# canonical address/cell derivation and its interface selection. base depends
# only on hypermesh-lib; STOQ does NOT depend on base (values are injected).
base = { path = "../base" }

# Core dependencies
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
lazy_static = { workspace = true }

# TrustChain - Proof of State and certificate system
# NOTE: TrustChain bootstraps independently first (see trustchain/BOOTSTRAP.md)
trustchain = { path = "../trustchain", default-features = false, features = ["ca", "ct", "dns", "proof-of-state"] }

# Blockchain dependencies already included below

# STOQ Protocol - Our transport layer
stoq = { path = "../stoq" }

# HyperMesh eBPF Intelligence Layer.
# kernel-attach + ebpf-loader compile the aya/libc kernel path and the
# clang-built XDP object (P5). The kernel path is guarded at runtime by
# capability detection (bpffs presence + graceful load fallback), so a
# node with no root/bpffs still runs unchanged in the userspace-only tier.
hypermesh-ebpf = { path = "../hypermesh-ebpf", features = ["kernel-attach", "ebpf-loader"] }

# Engauge Intelligence Layer (optional — routing + swarm analytics)
engauge = { path = "../engauge", optional = true }

# Caesar EVP (optional — economic layer)
caesar = { path = "../caesar", optional = true }

# Async runtime
async-trait = { workspace = true }
futures = { workspace = true }

# Cryptography
ring = { workspace = true }
x509-parser = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
pqcrypto-falcon = { workspace = true }
pqcrypto-kyber = { workspace = true }
pqcrypto-traits = { workspace = true }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base32 = "0.5"

# Storage
bincode = { workspace = true }

# Collections and concurrency
dashmap = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }

# Time handling
chrono = { workspace = true }

# Compression
brotli = { workspace = true }
reed-solomon-erasure = { workspace = true }
zstd = { workspace = true }  # Still needed by persistence modules

# Random number generation
rand = { workspace = true }

# Configuration and file formats
toml = { workspace = true }

# Networking
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
bytes = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
# webpki-roots = { workspace = true }  # REMOVED: Use TrustChain CA only

# HTTP
# http = ... # REMOVED: STOQ-only transport
# axum = ... # REMOVED: STOQ-only transport
# tower = ... # REMOVED: STOQ-only transport
# tower-http = ... # REMOVED: STOQ-only transport
# hyper = ... # REMOVED: STOQ-only transport

# Missing dependencies now added
# warp = ... # REMOVED: STOQ-only transport
semver = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true }
fastrand = { workspace = true }
# which = ... # REMOVED: zero usage in codebase
# prometheus = { workspace = true }  # REMOVED: Build native eBPF monitoring

# OS Integration - Sprint 2
num_cpus = "1.16"  # Cross-platform CPU core detection
sysinfo = "0.30"  # System information (CPU, memory, processes)

# Persistence dependencies - Sprint 1.5
rmp-serde = "1.3"  # MessagePack serialization
walkdir = "2.5"  # Directory traversal
dirs = "5.0"  # User directories
base64 = "0.22"  # Base64 encoding for IPC file transfer

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs"] }  # statvfs for storage detection
aya = { version = "0.12", features = ["async_tokio"] }  # Pure Rust eBPF library
libc = "0.2"  # For kernel version checks

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.13"  # Windows Management Instrumentation
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
ctor = "0.2"  # Test initialization functions
engauge = { path = "../engauge" }
# F3: unit and integration tests use trustchain's `StateProof::new_for_testing()`,
# which is only available with the `localhost-testing` feature (the `test` cfg
# does not cross the trustchain crate boundary). Enabling it here scopes the
# feature to blockmatrix test builds only — resolver "2" keeps release builds
# (the shipped hypermesh binary) free of the canned test proof.
trustchain = { path = "../trustchain", default-features = false, features = ["ca", "ct", "dns", "proof-of-state", "localhost-testing"] }

[features]
default = ["proof-of-state", "assets", "intelligence", "caesar"]
proof-of-state = []
assets = []
multi-node = []
future-tests = []
intelligence = ["dep:engauge"]
caesar = ["dep:caesar"]

# Explicit example entries for gated examples (require future-tests feature)
[[example]]
name = "pipeline_demo"
path = "examples/pipeline_demo.rs"
required-features = ["future-tests"]

[[example]]
name = "quic_basic"
path = "examples/quic_basic.rs"
required-features = ["future-tests"]

[[example]]
name = "quic_working"
path = "examples/quic_working.rs"
required-features = ["future-tests"]
