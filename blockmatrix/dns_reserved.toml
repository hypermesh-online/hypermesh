# Foundation-reserved domains. Cannot be registered without a foundation
# CA-signed grant. Enforced by `DnsRegistrar::register_domain` (see
# `blockmatrix/src/dns/registration.rs`) which calls
# `dns::reserved::is_reserved` before any chain write.
#
# This file is parsed at runtime via `lazy_static` from `dns/reserved.rs`,
# so adding entries here requires a daemon restart but no rebuild.
#
# Lookups are O(1) — entries are flattened into a single `HashSet<String>`
# (case-folded to lowercase) at first access.

[hypermesh_internal]
# Critical service names hard-reserved for the foundation. These resolve
# to foundation-owned services and must never be registrable by user
# nodes without an explicit grant.
domains = [
    "hypermesh",
    "trust",
    "caesar",
    "engauge",
    "catalog",
    "dashboard",
    "blockmatrix",
    "stoq",
    "foundation",
    "trustchain",
    "gateway",
    "api",
    "admin",
    "root",
    "system",
]

