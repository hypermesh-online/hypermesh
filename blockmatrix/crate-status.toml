[crate]
name = "Block-MATRIX"
id = "block-matrix"
description = "3D mesh topology, matrix-aware distributed computing, and asset pipeline"
phase = "alpha"

[features.working]
items = [
    "3D coordinate system (x,y,z positioning)",
    "Tensor math library (Vector3D, Matrix3x3, A*)",
    "Every-node blockchain (independent chains)",
    "Geospatial module (GPS conversion, clustering)",
    "Asset adapters (CPU/GPU/Memory/Storage/Network/Container)",
    "Privacy allocation (PrivacyMode: Anonymous/Private/Public)",
    "Matrix persistence (WAL, snapshots, recovery)",
    "Proof of State four-proof validation",
    "eBPF security manager with XDP attachment and policy enforcement",
    "ExtensionValidator for HyperMesh headers (PoS, asset hash, routing, privacy)",
    "Security integration framework (eBPF manager, syscall tracing, metrics collection)",
    "Privacy-eBPF bridge (PrivacyEbpfBridge tier updates, flexibility matrix, sync_to_kernel)",
    "Asset pipeline (Compress→Encrypt(Kyber-1024)→Shard→Distribute, correct order)",
    "Instruction-based retrieval (shard maps, client assembly, fallback strategies, <1KB instructions)",
]

[features.in_development]
items = [
    "Network scope sync + reflector pooling — Device↔Network chain synchronization (wired: SyncManager, ReflectorPool, BlockTransport, SyncDispatcher)",
    "Gateway architecture for cross-scope asset transfers and scope bridging (GatewayManager, ScopeBridge, AssetTransfer lifecycle)",
    "Dynamic shard rebalancing (RebalanceManager with join/leave/failure triggers, octant diversity, cooldown)",
]

[features.planned]
items = [
    "Tensor operations for cross-network transaction routing (NGauge↔Caesar matrix coordination)",
    "Cross-scope proxy routing — NAT-like asset access across blockchain scope boundaries",
    "Container runtime with isolation",
    "Multi-node production deployment",
    "Cross-platform node binary (Linux/macOS/Windows) with 1-click installation",
    "CLI for matrix topology queries, node management, and asset operations",
]
