[crate]
name = "Block-MATRIX"
id = "block-matrix"
description = "3D mesh topology, matrix-aware distributed computing, and asset pipeline"
phase = "alpha"

[features.working]
items = [
    # Matrix topology (real math, real data structures)
    "3D coordinate system (x,y,z positioning)",
    "Tensor math library (Vector3D, Matrix3x3, A*)",
    "Geospatial module (GPS conversion, clustering)",
    # Single-node blockchain (real persistence, real BLAKE3 hashing)
    "Every-node blockchain (independent Device chain, genesis on boot)",
    "Blockchain state persistence (WAL, snapshots, recovery via PersistenceManager, versioned block format v1 with BLAKE3 integrity verification on every read)",
    "NodeBlockchain::from_blocks() chain reconstruction with integrity validation",
    "Node resume path (load persisted genesis/blocks/cert from disk)",
    "BLAKE3 content hashing for blocks",
    # Asset pipeline (real crypto, real erasure coding — LOCAL ONLY)
    "Asset pipeline: Compress(Brotli)->Encrypt(Kyber-1024 KEM)->Shard(Reed-Solomon 10+4)->store locally",
    "Streaming-first asset pipeline — segment-oriented processing with per-segment compress/encrypt/shard (R13)",
    "Zstd compression with content-type auto-detection (video/audio skipped, text->Brotli, binary->Zstd)",
    "Per-segment Kyber-1024 KEM encryption — one KEM per asset, BLAKE3 HKDF per-segment AES-256-GCM keys",
    "Random-access byte range reconstruction — reconstruct only segments covering requested range",
    "Async streaming I/O — process_stream (AsyncRead) and reconstruct_to_writer (AsyncWrite) for bounded-memory pipelines",
    "Adaptive erasure coding (R14 — RS parameters scale with asset size)",
    "Store command: file -> pipeline -> local shard files + shard map",
    "Fetch command: local shard files -> reverse pipeline -> reconstructed file",
    # Asset adapters (data structures and trait impls, no network validation)
    "Asset adapters (CPU/GPU/Memory/Storage/Network/Container) — struct definitions and local operations",
    "AssetRegistration with BLAKE3 content hash (stored in blocks as hash only, not full data)",
    "IPv6 asset addressing (AssetAddress: fd48:4d00 prefix, matrix coords, content fingerprint)",
    # Privacy model (real type system, maps to transport layer correctly)
    "Privacy allocation (PrivacyMode: Anonymous/Private/Public — transport layer selection)",
    "Privacy-aware certificate strategy (NetworkType selection based on PrivacyMode)",
    "Node bootstrap Anonymous/Private/Public certificate routing",
    # Bootstrap and DNS (real, local only)
    "Node bootstrap lifecycle (genesis block, self-signed cert, DNS init)",
    "Internal DNS service registration (5 services at boot, resolve_service())",
    "DNS CLI (register/resolve/list subcommands)",
    "DNS persistence across restarts (dns_records.json)",
    "DNS-as-asset blockchain registration (proper AssetRegistration with BaseSystemType::Dns)",
    # CLI and platform
    "CLI for matrix topology queries, node management, and asset operations",
    "Cross-platform OsAbstraction (Linux/macOS/BSD/Windows, hardware detection)",
    "Real hardware metrics collection (CPU/memory/network/storage from /proc)",
    "Capability-based GPU detection (honest fallback, no fake hardware)",
    # Naming and identity
    "StateAuthenticator trait (binary authentication interface)",
    "PeerIdentity bridges to lib NodeId",
    "Proof of State validation on block creation — add_block() requires Vec<BlockAssetEntry>, each entry carries its own StateProof",
    "Per-entry proof hash — hπ = BLAKE3(StateProof) in every BlockAssetEntry, validated independently",
    "Canonical block formula — Block_i = { prev_hash, entries: [{ hA, hπ, state_proof, ptr }] }, no timestamp/coordinate/nonce",
    "Module split — chain.rs, mutations.rs, genesis_ops.rs, stoq_transport.rs (all <500L)",
    # Scope-aware block sync (HashMatrix)
    "Scope-aware block sync — Device (independent chains), Network/Private (shared chain full replication)",
    "SpatialBucketAssigner — adaptive neighborhood radius via sqrt(n) k-nearest peers, octree-like partitioning of 3D hash volume",
    # Genesis and hardware (R1)
    "Genesis hardware assessment — OsAbstraction detects CPU/Memory/Storage/Network/GPU, registers as assets in block #1",
    # IPC daemon architecture (Phase 1 Sprints 1-2)
    "JSON-RPC 2.0 IPC over Unix domain sockets (protocol, server, client, handler)",
    "Daemon lifecycle (connect/disconnect commands, PID file, graceful shutdown)",
    "IPC handler dispatch (ping, shutdown, status methods)",
    "DaemonState shared context for IPC handlers",
    "Socket path 3-tier fallback ($HYPERMESH_SOCK > $XDG_RUNTIME_DIR > ~/.hypermesh)",
    # IPC command wiring (Phase 1 Sprint 3)
    "IPC handler modules (dns, blockchain, network, topology, asset, config)",
    "All CLI commands route through IPC when daemon is running",
    "Standalone fallback for store/fetch without daemon",
    "CliOutput Serialize support for JSON IPC responses",
    # Config system (Phase 1 Sprint 4)
    "TOML config file (~/.hypermesh/config.toml) with load/save/merge",
    "Config CLI (show/get/set/init subcommands)",
    "--json global flag for machine-parseable output",
    "--config global flag for custom config path",
    "CLI flags override config file values (CLI > config > defaults)",
    # Domains & Network Naming (Phase 2)
    "Domain-as-network — registering a domain creates a Network-scope blockchain (BLAKE3 chain ID)",
    "DomainRegistration struct with parent chain derivation and persistence",
    "Hierarchical DNS resolution — walks parent domain chains right-to-left",
    "DomainNetworkManager — bridges domain names to SyncManager network join/leave",
    "Domain invitation tokens — BLAKE3-HMAC keyed by owner proof, time-bounded",
    "Domain CLI (register, create, list, nodes, invite subcommands)",
    "Join command — join a domain network with optional invitation token",
    "Domain IPC handlers (domain.register, domain.list, domain.join)",
    # Dashboard system (Phase 3) — dashboards are blockchain assets
    "Dashboard manifest (dashboard.toml) with parse/validate, scope-aware access (public/private)",
    "Dashboard CLI (deploy, list, info, init/scaffold)",
    "Dashboard scaffold generator — creates project structure with dashboard.toml and scope dirs",
    # Dashboard as blockchain asset (deploy → register on chain → store bundle → serve from chain)
    "Dashboard asset type (BaseSystemType::Dashboard, AssetType::Dashboard) — first-class blockchain asset",
    "Dashboard deploy pipeline — bundle files → BLAKE3 content hash → register on blockchain → store in asset store",
    "Dashboard IPC deploy — registers Dashboard asset on blockchain, stores bundle keyed by content hash",
    "Dashboard IPC list/info — queries blockchain for Dashboard-type assets (chain is source of truth)",
    "Default system dashboard auto-registered as blockchain asset on first boot (public/private scopes)",
    "STOQ API bridge — all IPC handler methods (20+) exposed over STOQ protocol via IpcBridgeHandler adapter",
    # Language SDKs wrapping Gateway REST API (all 20 endpoints)
    "TypeScript SDK (@hypermesh/sdk) — typed client wrapping Gateway /api/v1/* endpoints",
    "Python SDK (hypermesh) — sync (urllib) + async (httpx) client wrapping Gateway API",
    "C# SDK (HyperMesh.Sdk) — .NET 8.0 async client wrapping Gateway API",
    "C++ SDK (hypermesh_sdk) — C++17 POSIX socket client wrapping Gateway API",
    "Go SDK (sdk-go) — zero-dep client with context.Context wrapping Gateway API",
    # Per-service SDK modules (Caesar, TrustChain, Engauge, Catalog) in all 5 languages
    "SDK service modules — per-service base URLs/ports (Caesar:9294, TrustChain:8444, Engauge:9296, Catalog:9295)",
    "SDK examples and GUIDE.md for all 5 languages (basic, blockchain, dns, domain, dashboard)",
    # CLI service subcommands (route through IPC daemon)
    "CLI service subcommands (hypermesh caesar/trustchain/engauge/catalog) with IPC relay",
    "CLI --mode flag (auto/ffi/ipc/http) and per-service URL flags",
    # Config services section
    "Config [services] section (ConnectionMode, per-service URLs in config.toml)",
    # Identity, DNS propagation, CA enrollment (Phases 1-4)
    "Identity-as-asset — FALCON-1024 + Kyber-1024 keypair registered as SystemAssetKind::Identity blockchain asset in genesis block (R1/R10)",
    "Bilateral handshake wiring — connect_to_peer()/accept_connections() delegate to stoq bilateral handshake via NodeSigner+StateProofProvider traits, tested two-node local and local-to-GCP",
    "DNS propagation via blockchain — DnsBlockEntry serialized into BlockAssetEntry with BaseSystemType::Dns, extracted on receive, re-populated on restart",
    "CA certificate enrollment — after bilateral PoS handshake, TrustChain CA issues cert to replace self-signed bootstrap cert (§5.7 Phase 2)",
    "Stream type discrimination — CONN_TYPE_HANDSHAKE (0x00) and CONN_TYPE_PEER_MESSAGE (0x01) on every STOQ connection",
    "Genesis Proof of State from real hardware — stake formula (cores*mhz)+memory_mb ensures R13-compliant devices pass minimum_stake",
    "Recovery passphrase commitment in genesis block Identity asset — HKDF-SHA512 + BLAKE3 (§6.2.3)",
    "Block fetching protocol — TransportSyncDriver pulls missing blocks from reflectors via SyncRequest→SyncResponse→BlockFetchRequest→BlockFetchResponse over STOQ streams",
    "Metrics emission to engauge — MetricsReporter pushes Capacity + Congestion + Routing frames (eBPF-sourced) via STOQ streams (CONN_TYPE_METRICS=0x02) to peers every 30s with backoff",
    "Real FALCON-1024 signed state proofs — re-exports TrustChainProofProvider (WireSignedProof envelope with BLAKE3+FALCON signing/verification)",
    "Network sync MVP — shared --network-id CLI, runtime block propagation (5s poll), cross-genesis insertion, e2e verified two-node over QUIC",
    "Block sync wire protocol — TAG_BLOCK_ANNOUNCE format, BLAKE3 hash verification, insert_received_block with cross-genesis tolerance",
    "PoS-gated shard access control — AuthenticatedPeer tracking, verify_peer_access() gates shard/sync data messages, network-ID scoping, per-entry proof_hash validation (block announces are ungated)",
    "Shard distribution to network peers — placement-aware routing (closest peer by matrix coordinate), only to authenticated peers, graceful degradation to local storage",
    "IPC store handler — full pipeline (Compress→Encrypt→Shard→Distribute) with network distribution via shard transport",
    "ShardStore disk persistence — shards persisted to disk, loaded on restart, survives node restart",
    "Auth TTL — authenticated peers expire after 1 hour, re-authentication required",
    "Peer cleanup on disconnect — authenticated peers and coords removed when QUIC connection drops",
    "Gossip protocol wiring — GossipProtocol spawned in sync loop (15s, fanout=3), STOQ CONN_TYPE_GOSSIP=0x03, available_assets from ShardStore",
    "Stream type discrimination — 0x00=handshake, 0x01=peer_msg, 0x02=metrics, 0x03=gossip with message_handlers dispatch",
    "Swarm demand tracking — SwarmDemandTracker records per-shard fetch counts, timestamps, unique requesters from TAG_SHARD_FETCH messages",
    "Engauge intelligence bridge — feed_swarm_analytics(), compute_propagation_weights(), apply_path_recommendation() (feature-gated `intelligence`)",
    "BlockPropagator routing weights — PropagationWeight integration, peers sorted by engauge-computed weight, zero-weight filtered",
    "Bilateral PoS verification on peer auth",
    "Reflector health scoring and pruning",
    "Cross-node metrics pipeline (MetricsReporter)",
    "EngaugeBridge periodic feed + transmit",
    "ReplicationTrigger wired to IntelligenceLayer",
    "RoutingAdvisor weights in TransactionRouter",
    "Privacy tier mapping fix",
    # Sprint A1/B1/B2/C1 features
    "BlockHeader — lightweight header for selective chain reconstruction without full block data",
    "Shard refcount dedup — content-addressed dedup with DedupPolicy (Full/HashOnly/None), auto-GC at refcount 0 (R4)",
    "Privacy-scoped deduplication (R4 — DedupPolicy::HashOnly for Anonymous: detects dupes, saves storage, no refcount/provider tracking)",
    "Genesis adoption protocol — nodes join networks by adopting foreign genesis, then sync headers",
    "SyncMessage extensions — GenesisRequest/Response, HeaderRequest/Response, BlockRequest/Response",
    "ShardLocationIndex — shard-to-provider mapping for swarm discovery (R12)",
    "TAG_SHARD_ANNOUNCE wire protocol — nodes announce shard availability to peers",
    "Consumer-becomes-provider — post-fetch store + announce for swarm scaling (R12)",
    "Selective chain reconstruction — header-only storage for non-participating segments, prune_to_headers()",
    # Bug fixes (post-Sprint D1)
    "Post-handshake network_id metadata exchange — peers exchange network_id after STOQ handshake, backward-compatible with old nodes",
    "R7/R8 cipher compliance — quantum-resistant encryption (Kyber-1024 KEM) is default for ALL privacy modes including Anonymous",
    "Block propagation torrent model — ContentInterested strategy: Device=none, Private=full replication, Public=reflectors+spatial+consumers, Anonymous=consumers only",
    "Send-side spatial filtering — block_relevant_to_peer() checks shard placement relevance before propagating to Public mode peers",
    # Intelligence loop (H1-H7)
    "Intelligence feature enabled by default — engauge bridge compiles and runs in production",
    "Metrics ingestion wired — handle_metrics_connection feeds frames into engauge MetricsIngestionPipeline (no longer discarded)",
    "EngaugeBridge periodic feed — SwarmDemandTracker → SwarmAnalytics every 10s via tokio task",
    "Propagation weight feed — RoutingIntelligence → TensorWeightModifier → PropagationWeight every 15s",
    "Replication trigger — ReplicationTrigger.check() against live SwarmAnalytics, signals logged with urgency > 0.5",
    "intelligence.stats IPC endpoint — queryable metrics (shard_count, peer_count, uptime)",
    "10-50 node simulation harness — 9 integration tests (asset lifecycle, engauge feedback, shard loss, byzantine rejection, scaling, dedup, e2e loop)",
    # P2P File Sharing (J1-J7)
    "ShareInvite protocol — signed envelope with shard map + Kyber-wrapped DecryptionKey, FALCON-1024 signature, TAG_SHARE_INVITE wire protocol",
    "Key wrapping — encrypt/decrypt DecryptionKey with recipient's Kyber-1024 public key (KEM + BLAKE3-derived AES-256-GCM)",
    "InboxStore — async inbox with JSON persistence for received share invitations",
    "Share IPC handlers — share.send, share.inbox, share.accept, share.reject + identity.pubkey, peer.pubkey",
    "Share CLI — hypermesh share send/inbox/accept/reject/pubkey/peer-pubkey subcommands",
    "Sharing integration tests — 10 scenarios (full lifecycle, wrong key, invalid signature, multi-node fetch, persistence, KyberSegmented)",
    # Unified Asset Registration + Catalog Types (K1+K2)
    "Unified asset.register IPC — single handler for all asset types (system + application), replaces ad-hoc mutation paths",
    "Catalog type publishing — register_type() with BLAKE3 content-addressed schemas, type.publish + type.lookup STOQ API",
    "Built-in type definitions — Message, Invitation, Document pre-registered in Catalog with JSON Schema validation",
    # Private Messaging (K3-K6)
    "DirectMessage — Kyber-1024 encrypted body, FALCON-1024 signed, threading via reply_to, Application('Message') asset category",
    "MessageStore — blockchain-backed + YAML persistence, list_for_recipient, history_with_peer, Application asset registration",
    "TAG_DIRECT_MESSAGE (0x06) wire protocol + handler for peer-to-peer message delivery",
    "Message IPC handlers — message.send, message.inbox, message.history, message.read",
    "Message CLI — hypermesh message send/inbox/history/read subcommands",
    "Messaging integration tests — 8 scenarios (full lifecycle, threading, wrong key, invalid signature, history ordering, persistence)",
    # Core Protocol Completion (L1-L5)
    "Identity distribution — KeyRotationEntry written to blockchain, TAG_KEY_ROTATION (0x08) wire protocol, validate_key_continuity(), split-brain detection",
    "DNS popularity tracking — DnsPopularityTracker records resolution frequency, feeds engauge SwarmAnalytics",
    "Network DNS resolution — TAG_DNS_RESOLVE/RESPONSE wire protocol, resolve_from_network() queries peers when local fails",
    "Service IPC handlers — caesar.overview/balance/transactions/rewards/staking, engauge.capacity/traffic/throttle/routing, trustchain.status/certs/identity/federation, stoq.stats/connections/performance (16 methods, all local crate data via daemon)",
    "EbpfFeedbackAdapter wires engauge routing intelligence into kernel-level BPF maps",
    "Consumer-becomes-provider (R12) closed loop — post-fetch announce broadcast over STOQ, ShardLocationIndex shared between PeerContext and IPC daemon, replication poll (30s) drives extra-replica fetches via TAG_SHARD_FETCH",
    "EngaugeBridge::check_replication_signals — wraps ReplicationTrigger.check() so blockmatrix swarm coordinator can act on engauge popularity signals",
    "EngaugeTrustAdapter — implements trustchain TrustSignalProvider trait, exposes per-peer engauge signals (activity/capacity/traffic) to FederationManager.add_peer trust gating",
    "DaemonState federation_manager + threshold_coordinator fields — Optional Arcs gate the trustchain.request_cert IPC handler to use threshold signing when federation is opted in",
    # Phase G.1 — cross-network transfer choreography
    "Cross-network transfer wire protocol — TAG_TRANSFER_LOCK/REGISTER_REQ/REGISTER_ACK/RELEASE/ROLLBACK over STOQ, alpha-default inert via Option<Arc<TransferCoordinator>> on DaemonState",
    "TransferCoordinator orchestrator — Initiated→Locked→ShardsHandedOff→Registered→Released happy path with TargetRejected / RegisterTimeout rollback paths and FederationGate short-circuit",
    "TransferReceipt cross-chain block entry — written to BOTH chains linking source_block_hash and target_block_hash so an auditor can trace transfer atomicity from either side",
]

[features.in_development]
items = [
    # Cross-network asset transfer lifecycle
    "Cross-network asset transfers — wire protocol + state machine + happy/rollback/timeout coordinator landed in G.1 (5/5 g1_transfer_protocol_tests pass); persisted-state restart-recovery + multi-host e2e harness scoped to G.2/Phase I",
    # Security review pending
    "Block persistence integrity — tamper detection works (BLAKE3 canonical hash verified on every read, WAL replay, legacy compat), formal security audit pending",
    # Scope-aware sync (partially working)
    "Scope-aware Public HashMatrix filtering — SpatialBucketAssigner structural code exists, not e2e tested across nodes",
    "Asset-as-file-format — SystemAssets inline in block entries, user assets as self-contained header+body units",
    "Container runtime — ProcessIsolation with real spawn, cluster management, health+heartbeat (not integration-tested)",
]

[features.planned]
items = [
    "MFA identity Tier 3 — recovery execution (passphrase-based key recovery, threshold peer attestation k-of-n, Shamir key backup distribution) (§6.2.3)",
    "Browser namespace — Gateway bridges HTTP/3 to HyperMesh DNS namespace (http://persist → dashboard)",
]
