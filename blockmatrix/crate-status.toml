[crate]
name = "Block-MATRIX"
id = "block-matrix"
description = "3D mesh topology, matrix-aware distributed computing, and asset pipeline"
phase = "alpha"

[features.working]
items = [
    "3D coordinate system (x,y,z positioning)",
    "Tensor math library (Vector3D, Matrix3x3, A*)",
    "Every-node blockchain (independent chains)",
    "Geospatial module (GPS conversion, clustering)",
    "Asset adapters (CPU/GPU/Memory/Storage/Network/Container)",
    "Privacy allocation (PrivacyMode: Anonymous/Private/Public)",
    "Matrix persistence (WAL, snapshots, recovery)",
    "Proof of State four-proof validation",
    "eBPF security manager with XDP attachment and policy enforcement",
    "ExtensionValidator for HyperMesh headers (PoS, asset hash, routing, privacy)",
    "Security integration framework (eBPF manager, syscall tracing, metrics collection)",
    "Privacy-eBPF bridge (PrivacyEbpfBridge tier updates, flexibility matrix, sync_to_kernel)",
    "Asset pipeline (Compress->Encrypt(Kyber-1024)->Shard->Distribute, adaptive RS parameters by asset size)",
    "Cross-scope proxy routing (ScopeAwareRouter, gateway node selection, encryption enforcement)",
    "Tensor operations for cross-network transaction routing (TransactionRouter, scope-aware pathfinding, relay optimization)",
    "CLI for matrix topology queries, node management, and asset operations (CommandExecutor, CliOutput, 34 tests)",
    "Container runtime with process isolation (ProcessIsolation, real spawn/stop/resource tracking, 15 tests)",
    "Cross-platform node binary (OsAbstraction for Linux/macOS/BSD/Windows, PlatformInfo, hardware detection, 62 tests)",
    "BLAKE3 content hashing (whitepaper-aligned)",
    "Capability-based GPU detection (honest fallback, no fake hardware)",
    "StateAuthenticator trait (renamed from ConsensusValidator)",
    "Shard commitment (BLAKE3 hash anchoring blocks to spatial shard evidence)",
    "PoSPing spatial verification (epoch-seeded bilateral probes, scope-gated, binary result)",
    "IPv6 asset addressing (AssetAddress: fd48:4d00 prefix, matrix coords, content fingerprint, shard sub-addressing)",
    "Asset transfer protocol (TransferEngine, StateProofBytes, PoS-authenticated transfers with blockchain receipts)",
    "10-node transfer simulation (helix topology, sequential chain transfers, fingerprint preservation, 6 tests)",
    "Node bootstrap lifecycle (genesis block, self-signed cert, DNS init)",
    "Real hardware metrics collection (CPU/memory/network/storage from /proc)",
    "PeerIdentity bridges to lib NodeId (to_node_id(), From<&ScopedIdentity>)",
    "NodeFingerprint From<NodeId> conversion (same 32-byte concept)",
    "NetworkScope::from_identity() for scope-aware asset access",
    "Genesis capability assessment (R1, R10 — GenesisAssessor: hardware probe -> GenesisAssetRecord per resource with IPv6 addressing)",
    "Asset blockchain registration (register_asset_record creates block, validates PoS, appends to chain)",
    "Automatic shard commitment in block production (R12 — BLAKE3(sorted placements) computed and set on block)",
    "Distribution audit trail (record_to_blockchain, verify_placement, query_audit_trail — real BLAKE3-based ledger)",
    "Adaptive erasure coding (R14 — ErasureCodingParams::for_asset_size wired into pipeline, scales RS with asset size)",
    "Network trust layer (BLAKE3 crypto for p2p/federated/public, NodeId-based auth, PrivacyMode-aware trust)",
    "ShardTransport trait (send_shard/fetch_shard/is_reachable, MockShardTransport for testing)",
    "Instruction-based retrieval with ShardTransport integration (fetch_from_location wired to trait)",
    "mDNS peer discovery (PeerAnnouncement, multicast protocol on _hypermesh._udp.local)",
    "Gossip protocol for mesh coordination (GossipState, membership tracking, configurable fanout/interval)",
    "Full retrieval pipeline via ShardTransport (retrieve_asset: fetch → RS reconstruct → decrypt → decompress)",
    "Network scope sync wired to BlockTransport (TransportSyncDriver: reflector discovery, block propagation, state update)",
    "Dynamic shard rebalancing with real transport (execute_actions_via_transport: move/replicate shards via ShardTransport)",
    "Swarm distribution protocol (R12 — SwarmProtocol: announce/discover/serve, cascade providers, O(log N) per-node load)",
    "Streaming shard reconstruction (R13 — StreamingReconstructor: incremental per-group RS decode, memory-efficient)",
    "Shard migration (R14 — MigrationExecutor: copy-then-redirect, non-blocking reads, rollback on failure)",
    "Privacy-scoped dedup verification (R4 — PrivacyScopedDedup: full tracking Device/Private, hash-only Anonymous, tamper detection)",
    "Min-spec validation (R13 — MinSpecValidator: 1Mb/s bandwidth, 50GB storage, 4GB RAM, 2-core budget checks)",
    "Gateway cross-scope transfers wired to ShardTransport (Lock→Transfer→Unlock with real shard movement)",
    "Multi-node deployment wired to gossip+transport (ClusterTransportBridge: sync_from_gossip, probe_health via ShardTransport)",
    "Service mesh load balancer (MeshLoadBalancer: RoundRobin + LeastConnections, health-aware endpoint filtering)",
    "User contribution distribution bridge (ContributionDistributionBridge: wired to SwarmProtocol for announce/serve shards)",
    "Intelligence metrics bridge (IntelligenceMetricsCollector: real /proc CPU/memory via hardware module, processing stats)",
    "Performance monitoring integration (MonitoringIntegration with record/flush, AlertingManager with threshold breach detection)",
    "Performance regression prevention (RegressionDetector: baseline comparison, per-metric tolerance, configurable alerts)",
    "1M-node stress test simulation (R12, R13 — cascade O(log N) verification, min-spec budget validation, shard commitment scaling)",
    "Node bootstrap Anonymous certificate strategy (select_certificate_strategy routes by PrivacyMode)",
]

