[crate]
name = "Block-MATRIX"
id = "block-matrix"
description = "3D mesh topology, matrix-aware distributed computing, and asset pipeline"
phase = "alpha"

[features.working]
items = [
    # Matrix topology (real math, real data structures)
    "3D coordinate system (x,y,z positioning)",
    "Tensor math library (Vector3D, Matrix3x3, A*)",
    # Single-node blockchain (real persistence, real BLAKE3 hashing)
    "Every-node blockchain (independent Device chain, genesis on boot)",
    "Blockchain state persistence (WAL, snapshots, recovery via PersistenceManager, versioned block format v1 with BLAKE3 integrity verification on every read) — until S3.0 the machinery existed but RUNTIME blocks never reached it (save_block had no call site in mutations.rs), so every stored asset was lost on restart",
    "S3.0 durable block write-through — BlockSink at the insert_block chokepoint persists every block (genesis and runtime), fail-closed: persist before in-memory publish, so a failed write cannot be silently accepted",
    "S3.0 blocking I/O off the async path — fsync/WAL/metadata/index writes moved to spawn_blocking (previously ran on a tokio worker inside four held chain write locks, once per block)",
    "S3.0 add_block head→insert race fixed via head reservation — concurrent writers went 2/8 → 8/8 with no silent loss",
    "S3.0 deterministic genesis — four clock reads removed from the genesis path so peers can reproduce and adopt it; live runtime proofs keep real clocks + freshness nonces",
    "S3.0 genesis adoption transport — genesis request/response carries a real verified Block instead of a hash string, recorded non-destructively per network (destructive adopt_genesis deliberately not wired — S3.4)",
    "NodeBlockchain::from_blocks() chain reconstruction with integrity validation",
    "Node resume path (load persisted genesis/blocks/cert from disk)",
    "BLAKE3 content hashing for blocks",
    # Asset pipeline (real crypto, real erasure coding — LOCAL ONLY)
    "Asset pipeline: Compress(Brotli)->Encrypt(Kyber-1024 KEM)->Shard(ngauge/NGauge Sharder, RS 10+4)->store locally",
    "Sharding authority is NGauge (A1) — blockmatrix pipeline CONSUMES ngauge::Sharder/ShardingConfig; Shard/ShardMetadata/ShardingStats live in hypermesh-lib (no dependency cycle)",
    "Adaptive erasure coding (R14 — RS parameters scale with asset size), engine now provided by ngauge::Sharder",
    "Store command: file -> pipeline -> local shard files + shard map",
    "Fetch command: local shard files -> reverse pipeline -> reconstructed file",
    # Asset adapters (data structures and trait impls, no network validation)
    "Asset adapters (CPU/GPU/Memory/Storage/Network/Container) — struct definitions and local operations",
    "AssetRegistration with BLAKE3 content hash (stored in blocks as hash only, not full data)",
    # Privacy model (real type system, maps to transport layer correctly)
    "Privacy allocation (PrivacyMode: Anonymous/Private/Public — transport layer selection)",
    "Privacy-aware certificate strategy (NetworkType selection based on PrivacyMode)",
    "Node bootstrap Anonymous/Private/Public certificate routing",
    # Bootstrap and DNS (real, local only)
    "Node bootstrap lifecycle (genesis block, self-signed cert, DNS init)",
    "Internal DNS service registration (5 services at boot, resolve_service())",
    "DNS CLI (register/resolve/list subcommands)",
    "DNS persistence across restarts (dns_records.json)",
    "DNS-as-asset blockchain registration (proper AssetRegistration with BaseSystemType::Dns)",
    # CLI and platform
    "CLI for matrix topology queries, node management, and asset operations",
    "Cross-platform OsAbstraction (Linux/macOS/BSD/Windows, hardware detection)",
    "Real hardware metrics collection (CPU/memory/network/storage from /proc)",
    "Capability-based GPU detection (honest fallback, no fake hardware)",
    # Naming and identity
    "StateAuthenticator trait (binary authentication interface)",
    "PeerIdentity bridges to lib NodeId",
    "Proof of State validation on block creation — add_block() requires Vec<BlockAssetEntry>, each entry carries its own StateProof",
    "Per-entry proof hash — hπ = BLAKE3(StateProof) in every BlockAssetEntry, validated independently",
    "Canonical block formula — Block_i = { prev_hash, entries: [{ hA, hπ, state_proof, ptr }] }, no timestamp/coordinate/nonce",
    "Module split — chain.rs, mutations.rs, genesis_ops.rs, stoq_transport.rs (all <500L)",
    # Scope-aware block sync (HashMatrix)
    "Scope-aware block sync (Device scope) — independent per-node Device chains persist and reconstruct",
    # Genesis and hardware (R1)
    "Genesis hardware assessment — OsAbstraction detects CPU/Memory/Storage/Network/GPU, registers as assets in block #1",
    # IPC daemon architecture (Phase 1 Sprints 1-2)
    "JSON-RPC 2.0 IPC over Unix domain sockets (protocol, server, client, handler)",
    "Daemon lifecycle (connect/disconnect commands, PID file, graceful shutdown)",
    "IPC handler dispatch (ping, shutdown, status methods)",
    "DaemonState shared context for IPC handlers",
    "Socket path 3-tier fallback ($HYPERMESH_SOCK > $XDG_RUNTIME_DIR > ~/.hypermesh)",
    # IPC command wiring (Phase 1 Sprint 3)
    "IPC handler modules (dns, blockchain, network, topology, asset, config)",
    "All CLI commands route through IPC when daemon is running",
    "Standalone fallback for store/fetch without daemon",
    "CliOutput Serialize support for JSON IPC responses",
    # Config system (Phase 1 Sprint 4)
    "TOML config file (~/.hypermesh/config.toml) with load/save/merge",
    "Config CLI (show/get/set/init subcommands)",
    "--json global flag for machine-parseable output",
    "--config global flag for custom config path",
    "CLI flags override config file values (CLI > config > defaults)",
    # Domains & Network Naming (Phase 2)
    "Domain-as-network — registering a domain creates a Network-scope blockchain (BLAKE3 chain ID)",
    "DomainRegistration struct with parent chain derivation and persistence",
    "Hierarchical DNS resolution — walks parent domain chains right-to-left",
    "DomainNetworkManager — bridges domain names to SyncManager network join/leave",
    "Domain invitation tokens — BLAKE3-HMAC keyed by owner proof, time-bounded",
    "Domain CLI (register, create, list, nodes, invite subcommands)",
    "Join command — join a domain network with optional invitation token",
    "Domain IPC handlers (domain.register, domain.list, domain.join)",
    # Dashboard system (Phase 3) — dashboards are blockchain assets
    "Dashboard manifest (dashboard.toml) with parse/validate, scope-aware access (public/private)",
    "Dashboard CLI (deploy, list, info, init/scaffold)",
    "Dashboard scaffold generator — creates project structure with dashboard.toml and scope dirs",
    # Dashboard as blockchain asset (deploy → register on chain → store bundle → serve from chain)
    "Dashboard asset type (BaseSystemType::Dashboard, AssetType::Dashboard) — first-class blockchain asset",
    "Dashboard deploy pipeline — bundle files → BLAKE3 content hash → register on blockchain → store in asset store",
    "Dashboard IPC deploy — registers Dashboard asset on blockchain, stores bundle keyed by content hash",
    "Dashboard IPC list/info — queries blockchain for Dashboard-type assets (chain is source of truth)",
    "Default system dashboard auto-registered as blockchain asset on first boot (public/private scopes)",
    "STOQ API bridge — all IPC handler methods (20+) exposed over STOQ protocol via IpcBridgeHandler adapter",
    # Language SDKs wrapping Gateway REST API (all 20 endpoints)
    "TypeScript SDK (@hypermesh/sdk) — typed client wrapping Gateway /api/v1/* endpoints",
    "Python SDK (hypermesh) — sync (urllib) + async (httpx) client wrapping Gateway API",
    "C# SDK (HyperMesh.Sdk) — .NET 8.0 async client wrapping Gateway API",
    "C++ SDK (hypermesh_sdk) — C++17 POSIX socket client wrapping Gateway API",
    "Go SDK (sdk-go) — zero-dep client with context.Context wrapping Gateway API",
    # Per-service SDK modules (Caesar, TrustChain, NGauge, Catalog) in all 5 languages
    "SDK service modules — per-service base URLs/ports (Caesar:9294, TrustChain:8444, NGauge:9296, Catalog:9295)",
    "SDK examples and GUIDE.md for all 5 languages (basic, blockchain, dns, domain, dashboard)",
    # CLI service subcommands (route through IPC daemon)
    "CLI --mode flag (auto/ffi/ipc/http) and per-service URL flags",
    # Config services section
    "Config [services] section (ConnectionMode, per-service URLs in config.toml)",
    # Identity, DNS propagation, CA enrollment (Phases 1-4)
    "Identity-as-asset — FALCON-1024 + Kyber-1024 keypair registered as SystemAssetKind::Identity blockchain asset in genesis block (R1/R10)",
    "Bilateral handshake wiring — connect_to_peer()/accept_connections() delegate to stoq bilateral handshake via NodeSigner+StateProofProvider traits, tested two-node local and local-to-GCP",
    "DNS propagation via blockchain — DnsBlockEntry serialized into BlockAssetEntry with BaseSystemType::Dns, extracted on receive, re-populated on restart",
    "CA certificate enrollment — after bilateral PoS handshake, TrustChain CA issues cert to replace self-signed bootstrap cert (§5.7 Phase 2)",
    "Stream type discrimination — CONN_TYPE_HANDSHAKE (0x00) and CONN_TYPE_PEER_MESSAGE (0x01) on every STOQ connection",
    "Genesis Proof of State from real hardware — OsAbstraction-assessed capabilities bind the four proofs (S1 removed the (cores*mhz)+memory_mb stake formula and the minimum_stake gate; capacity is descriptive, PoStake is an identity binding)",
    "Recovery passphrase commitment in genesis block Identity asset — HKDF-SHA512 + BLAKE3 (§6.2.3)",
    "Real FALCON-1024 signed state proofs — re-exports TrustChainProofProvider (WireSignedProof envelope with BLAKE3+FALCON signing/verification)",
    "Block sync wire protocol — TAG_BLOCK_ANNOUNCE format, BLAKE3 hash verification, insert_received_block with cross-genesis tolerance",
    "PoS-gated shard access control — AuthenticatedPeer tracking, verify_peer_access() gates shard/sync/block-announce/transfer/CA messages, network-ID scoping, per-entry proof_hash validation (P1/F1: TAG_BLOCK_ANNOUNCE now in the needs_auth allowlist — a mirror is only accepted from a bilaterally-PoS-authenticated peer)",
    "Shard distribution to network peers — placement-aware routing (closest peer by matrix coordinate), only to authenticated peers, graceful degradation to local storage",
    "IPC store handler — full pipeline (Compress→Encrypt→Shard→Distribute) with network distribution via shard transport",
    "ShardStore disk persistence — shards persisted to disk, loaded on restart, survives node restart",
    "Auth TTL — authenticated peers expire after 1 hour, re-authentication required",
    "Peer cleanup on disconnect — authenticated peers and coords removed when QUIC connection drops",
    "Gossip protocol wiring — GossipProtocol spawned in sync loop (15s, fanout=3), STOQ CONN_TYPE_GOSSIP=0x03, available_assets from ShardStore",
    "Stream type discrimination — 0x00=handshake, 0x01=peer_msg, 0x02=metrics, 0x03=gossip with message_handlers dispatch",
    "Swarm demand tracking — SwarmDemandTracker records per-shard fetch counts, timestamps, unique requesters from TAG_SHARD_FETCH messages",
    "Bilateral PoS verification on peer auth",
    "Reflector health scoring and pruning",
    "Privacy tier mapping fix",
    # Sprint A1/B1/B2/C1 features
    "BlockHeader — lightweight header for selective chain reconstruction without full block data",
    "Shard refcount dedup — content-addressed dedup with DedupPolicy (Full/HashOnly/None), auto-GC at refcount 0 (R4)",
    "Privacy-scoped deduplication (R4 — DedupPolicy::HashOnly for Anonymous: detects dupes, saves storage, no refcount/provider tracking)",
    "SyncMessage extensions — GenesisRequest/Response, HeaderRequest/Response, BlockRequest/Response",
    "ShardLocationIndex — shard-to-provider mapping for swarm discovery (R12)",
    "TAG_SHARD_ANNOUNCE wire protocol — nodes announce shard availability to peers",
    "Consumer-becomes-provider — post-fetch store + announce for swarm scaling (R12)",
    "Selective chain reconstruction — header-only storage for non-participating segments, prune_to_headers()",
    # Bug fixes (post-Sprint D1)
    "Post-handshake network_id metadata exchange — peers exchange network_id after STOQ handshake, backward-compatible with old nodes",
    "R7/R8 cipher compliance — quantum-resistant encryption (Kyber-1024 KEM) is default for ALL privacy modes including Anonymous",
    "Block propagation torrent model — ContentInterested strategy: Device=none, Private=full replication, Public=reflectors+spatial+consumers, Anonymous=consumers only",
    "Send-side spatial filtering — block_relevant_to_peer() checks shard placement relevance before propagating to Public mode peers",
    # Intelligence loop (H1-H7)
    "Intelligence feature enabled by default — ngauge bridge compiles and runs in production",
    "intelligence.stats IPC endpoint — queryable metrics (shard_count, peer_count, uptime)",
    "10-50 node simulation harness — 9 integration tests (asset lifecycle, ngauge feedback, shard loss, byzantine rejection, scaling, dedup, e2e loop)",
    # P2P File Sharing (J1-J7)
    "ShareInvite protocol — signed envelope with shard map + Kyber-wrapped DecryptionKey, FALCON-1024 signature, TAG_SHARE_INVITE wire protocol",
    "Key wrapping — encrypt/decrypt DecryptionKey with recipient's Kyber-1024 public key (KEM + BLAKE3-derived AES-256-GCM)",
    "InboxStore — async inbox with JSON persistence for received share invitations",
    "Share IPC handlers — share.send, share.inbox, share.accept, share.reject + identity.pubkey, peer.pubkey",
    "Share CLI — hypermesh share send/inbox/accept/reject/pubkey/peer-pubkey subcommands",
    "Sharing integration tests — 10 scenarios (full lifecycle, wrong key, invalid signature, multi-node fetch, persistence, KyberSegmented)",
    # Unified Asset Registration + Catalog Types (K1+K2)
    "Unified asset.register IPC — single handler for all asset types (system + application), replaces ad-hoc mutation paths",
    "Catalog type publishing — register_type() with BLAKE3 content-addressed schemas, type.publish + type.lookup STOQ API",
    "Built-in type definitions — Message, Invitation, Document pre-registered in Catalog with JSON Schema validation",
    # Private Messaging (K3-K6)
    "DirectMessage — Kyber-1024 encrypted body, FALCON-1024 signed, threading via reply_to, Application('Message') asset category",
    "MessageStore — blockchain-backed + YAML persistence, list_for_recipient, history_with_peer, Application asset registration",
    "TAG_DIRECT_MESSAGE (0x06) wire protocol + handler for peer-to-peer message delivery",
    "Message CLI — hypermesh message send/inbox/history/read subcommands",
    "Messaging integration tests — 8 scenarios (full lifecycle, threading, wrong key, invalid signature, history ordering, persistence)",
    # Core Protocol Completion (L1-L5)
    "Identity distribution — KeyRotationEntry written to blockchain, TAG_KEY_ROTATION (0x08) wire protocol, validate_key_continuity(), split-brain detection",
    "Network DNS resolution — TAG_DNS_RESOLVE/RESPONSE wire protocol, resolve_from_network() queries peers when local fails",
    "DaemonState federation_manager + threshold_coordinator fields — Optional Arcs gate the trustchain.request_cert IPC handler to use threshold signing when federation is opted in",
    # Phase G.1 — cross-network transfer choreography
    "Cross-network transfer wire protocol — TAG_TRANSFER_LOCK/REGISTER_REQ/REGISTER_ACK/RELEASE/ROLLBACK over STOQ, alpha-default inert via Option<Arc<TransferCoordinator>> on DaemonState",
    "TransferCoordinator orchestrator — Initiated→Locked→ShardsHandedOff→Registered→Released happy path with TargetRejected / RegisterTimeout rollback paths and FederationGate short-circuit",
    "TransferReceipt cross-chain block entry — written to BOTH chains linking source_block_hash and target_block_hash so an auditor can trace transfer atomicity from either side",
    # Phase G.2 — durable cross-network transfer choreography
    "Cross-network transfer chain-scan recovery — TransferCoordinator::resume_in_flight scans NodeBlockchain for TransferLockEntry without matching TransferReleaseEntry, reconstructs CoordinatedTransfer state, repopulates in-memory map (chain is the durable state machine; no separate snapshot file needed)",
    "Transfer wire dispatch via PeerContext.transfer_coordinator — handle_transfer_register_req routes through TransferCoordinator::handle_register_request and writes ack back over the same stream; handle_transfer_register_ack delivers oneshot acks to awaiting initiate() futures via deliver_register_ack/register_ack_waiter; alpha-default inert when transfer_coordinator is None",
    "Two-host transfer e2e integration test — bridged-transport harness exercises full source↔target choreography with JSON wire-format round-trips on every TAG; crash-recovery test drops mid-flight coordinator after Lock and asserts resume_in_flight on a fresh coordinator rediscovers the in-flight transfer",
    # Phase H.1 — distributed DNS + reserved domains + foundation grant
    "Reserved-domain enforcement — top 1000 + Fortune 1000 brands + hypermesh-internal services hard-reserved; foundation CA-signed grant required for registration",
    "Foundation DNS grant flow — dns.foundation_grant IPC, FoundationGrant struct with FALCON-1024 sig, recorded as foundation.dns_grant/v1 catalog asset",
    "Network-wide DNS resolution with conflict resolution — TAG_DNS_QUERY/RESPONSE over STOQ; canonical entry by (foundation_grant_present, registration_timestamp, chain_height)",
    "DnsBlockEntry.grant_signature field — foundation FALCON-1024 signature persisted on chain, build_dns_response_for_query reads grant_signature.is_some() to set foundation_grant_present in distributed DNS responses (backward-compatible Option<Vec<u8>> via #[serde(default)])",
    # Phase I.1 — matrix hardening + cross-chain validation + header sync
    "Cross-chain receipt linking — CrossChainReceiptValidator indexes TransferReceipt entries by both source and target anchors, validate_cross_chain proves source→target block linkage from either side without consulting the other chain",
    "CrossChainValidator::validate_cross_chain — looks up receipt by (source_chain_id, source_block_hash), verifies receipt's target_chain_id and target_block_hash match the request, returns specific error variants on mismatch",
    "chain.lookup_cross_receipt IPC — queries cross-chain receipt index by transfer_id, returns both source and target block hashes so an auditor can prove transfer atomicity from either side",
    "Header-only sync mode — SyncManager prefer_headers_mode flag activates HeaderRequest/HeaderResponse for low-bandwidth peers (substrate for Phase K light client); generate_sync_request emits HeaderRequest instead of full Request, headers_only_sync_count metric tracks adoption",
    "20-node real-subprocess multi-host harness — scripts/run-matrix-harness.sh orchestrator spawns N hypermesh subprocesses, blockmatrix/tests/i1_multihost_harness.rs covers 3 in-process scenarios (DNS grant attestation, concurrent receipt convergence, validator rebuild from chain) plus subprocess-driver smoke check (ignored unless HM_RUN_SUBPROCESS_HARNESS=1)",
    "StoqTransferTransport — production daemon TransferTransport wrapping NetworkManager + Weak<TransferCoordinator>; broadcast_lock/release/rollback fanout over STOQ unidirectional streams, send_register_request opens a stream to a specific peer and awaits oneshot ack delivered by wire handler via PeerContext.transfer_coordinator.deliver_register_ack",
    # Phase J.1 — upgrade migration substrate
    "Release feed subscription — foundation-signed release.feed/v1 catalog asset, FALCON-1024 verification, latest-by-channel cache (alpha-default inert until foundation pubkey configured)",
    "system.check_update + system.apply_update IPC — daemon surfaces available version with release notes URL, opt-in apply (P7: real atomic binary swap — stage to temp, fsync, chmod +x, std::fs::rename over target, schedule_restart only on success)",
    "IPC protocol_version field — major mismatch returns helpful error (-32100 PROTOCOL_VERSION_MISMATCH); minor forward-compat; old clients without field still accepted",
    "Block format V2 magic reservation (BLOCK_MAGIC_V2 = HMB\\x02) + format_migrations registry — future format changes have a migration path; migrate_v1_to_v2 currently identity since V2 schema == V1",
    "hypermesh update CLI command + status banner — `hypermesh status` surfaces \"Update available\" line; `hypermesh update [--channel] [--version]` invokes system.apply_update through IPC",
    # Phase K.1 — light/thin client tier + capability tokens
    "Light node mode (--mode light) — HeaderSyncManager + WitnessedProofVerifier, header-only sync, no shard/pipeline state (alpha ships flag + types + tests; full startup minimization staged as K.1.5)",
    "Capability tokens — FALCON-signed CapabilityToken with ViewOnly/Wallet/AssetWrite/Admin scopes, bound to device pubkey, daemon verification, RevocationRegistry, validate() composite check",
    "auth.create_session/list_sessions/revoke_session IPC — admin-issued tokens, alpha-default inert when capability_token_issuer is None",
    "SessionAudit chain entry — every session creation/revocation/capability-use recorded as Identity-category BlockAssetEntry with versioned JSON payload for user-side audit trail",
    # Phase K.2 — capability-token IPC enforcement + SDK integration
    "Capability-token IPC middleware — enforces required scope per method via fail-closed registry; CAPABILITY_DENIED (-32004) on missing/expired/revoked/insufficient-scope; alpha-default skips when capability_token_issuer is None",
    "Method-to-capability registry — explicit ViewOnly/Wallet/AssetWrite/Admin mapping for 50+ IPC methods, fail-closed Admin default for unknown",
    "RpcRequest.capability_token optional field — backward-compat with pre-K.2 clients (None bypasses enforcement when issuer not configured); RpcRequest::new_with_token() helper for SDKs",
    "CapabilityContext — base64 token decode + FALCON verify + expiry + revocation + scope check, returns CAPABILITY_DENIED RpcError on any failure",
    # P5/F6 — eBPF kernel gate + PoS-authenticated shard fetch
    "F6 per-asset shard-fetch authorization — authorize_shard_fetch() binds TAG_SHARD_FETCH to (a) the requester's PoS proof (verify_shard_proof_binding) and (b) the shard belonging to an asset registered on our chain (authorizes_shard); a peer whose proof does not authorize that asset is refused",
    # P6 — NGauge reconciler convergence + TTL cache + version negotiation
    "TTL shard-location cache — provider records age like dns::cache (DEFAULT_PROVIDER_TTL 300s, is_expired sweep); expired providers are not handed out as fetch sources",
    "STOQ protocol-version negotiation — handshake carries protocol_version, major mismatch rejected BEFORE trust is granted, old peers without the field still accepted (serde default)",
    "Orphan-buffer bound — MAX_ORPHANS + 120s TTL sweep on the buffer-then-link path prevents distinct-prev-hash orphan floods from exhausting memory",
    # P7 — substrate extraction
    "Matrix coordinate derivation delegates to base substrate — coordinate.rs calls base derive_cell/derive_address (fd48:4d00::/32), one canonical BLAKE3 construction shared across the workspace",
    # A1 — sharding authority moved into NGauge (ngauge)
    "A1 sharding-engine move — Reed-Solomon engine (Sharder/ShardingConfig) now lives in ngauge/NGauge; blockmatrix pipeline calls it via a re-export shim (assets/pipeline/sharding.rs), byte-identical round-trip seam-tested",
    # A2 — two-layer mirror retrieval
    "Two-layer mirror retrieval — client-assembly fetch resolves live mirrors FIRST then the plan's canonical matrix placements (location_resolver), with a TAG_SHARD_LOCATE upstream-tracker fallback when connected peers miss",
    "Unified seed-on-fetch — client-assembly and IPC fetch paths share ONE become-provider seeder; a fetched shard is re-announced only AFTER the BLAKE3 content-validity gate passes (mirror invariant #1)",
    # A3 — share.send wire delivery
    "share.send wire delivery — NetworkManager::send_tagged_to_peer frames [TAG_SHARE_INVITE]++invite_wire to the recipient over STOQ; receiver inbox + share.accept round-trip complete; delivered flag + graceful created_undelivered on failure",
    # A4-MIRROR (#33) — per-shard mirror invariant on every live path
    "Live re-announce gate — seed_fetched_shard → reannounce_authorized → blockchain.authorizes_shard: a fetched shard is only re-announced when it is content-bound on THIS node's chain; the ungated ClientAssembler seeder is doc-guarded as unwired-to-production",
    "Per-shard MIRROR INVARIANT complete on every live path — content-valid (BLAKE3) on every RECEIVE + signed-to-content (authorizes_shard) on every SERVE / RE-ANNOUNCE / BLOCK-ACCEPT",
    # A6.1 — on-chain shard registration at publish
    "On-chain shard registration at publish — IPC store handler writes a content-bound StoragePointer::Sharded BlockAssetEntry via add_block, so authorizes_shard(content_hash) returns true; store result surfaces registered_block + shard_hashes (unblocks the serve + re-seed gates)",
    # A6.6 — interest-scoped asset registration delivered on fetch
    "Interest-scoped registration on fetch — a served SHARD_FETCH response envelope (shard_len(4)+shard_data+registration_json, content-hash-disambiguated) carries that ONE asset's BlockAssetEntry (NodeBlockchain::registration_for_shard); the fetcher re-validates (content_binding_ok + shard-coverage + state_proof.validate) and re-anchors a FRESH block on ITS OWN chain, becoming a mirror WITHOUT syncing the server's chain (revalidate_and_register)",
    # A6.4 — gated multi-node mirror E2E
    "3-node subprocess mirror E2E (gated) — tests/a6_mirror_e2e.rs (#[ignore], HM_RUN_SUBPROCESS_HARNESS=1): A publishes → B fetches + becomes mirror (announce_targets>0) → C fetches from mirror B",
]

[features.in_development]
items = [
    # Reconciled against full-system audit 2026-07-30 (moved out of [working] — built but not on the live path)
    "Network sync — block propagation works PUSH-only to startup-injected peers; late/accepted peers never receive blocks (W2-92 duplicate connection registry) and cross-genesis convergence is NOT achievable on the shipped accept path (W1-1 adopt_genesis test-only); demote of prior 'Network sync MVP / cross-genesis insertion' claim",
    "Block-fetch / reflector sync-pull — TransportSyncDriver + SyncRequest→BlockFetchRequest exist but dial an unauthenticated CONN_TYPE_PEER_MESSAGE connection whose messages the receiver drops (W2-91/W2-26); run_sync_round returns zero blocks, catch-up sync inert",
    "Catch-up sync completeness — SyncManager flips to Synchronized after every round regardless of remaining lag (W1-2); a lagging node cannot reliably converge",
    "Streaming segment pipeline (R13) — segment compress/encrypt/shard, Zstd content-type auto-detect, per-segment Kyber-1024 HKDF keys, random-access byte range, async streaming I/O: fully built + tested but DORMANT; the live store/fetch path uses the whole-blob AssetPipeline (W2-52/W2-73), so R13 bounded-memory is not enforced live",
    "Metrics → ngauge pipeline — MetricsReporter emits and handle_metrics_connection ingests, but wire frames never deserialize into ngauge::MetricsFrame (NodeId hex vs [u8;32], W2-31); ingestion is starved so downstream routing/trending has no data source",
    "Intelligence feedback loops — NGauge bridge periodic feed (10s), propagation-weight feed (15s), RoutingAdvisor/BlockPropagator weighting run but compute from a fresh, never-fed RoutingIntelligence (permanently neutral, W1-46/W1-49); the 10s feed re-ingests the full cumulative demand snapshot so signals inflate with uptime not demand (W1-35/W1-47)",
    "Replication R12 loop — consumer-becomes-provider announce + 30s replication poll run, but the actuator discards fetched replica bytes and registers phantom providership (W1-34), and DispersionAdvisor anti-affinity is a live no-op (fresh advisor per poll, register_replica never fed, W1-37/W2-25); loop is NOT closed/convergent on the shipped binary",
    "SpatialBucketAssigner — built but dead in production; Public-mode block sync never runs spatial hash-bucket filtering (W1-41)",
    "EbpfFeedbackAdapter / peer-auth→kernel mirror — set_routing_rule/set_privacy_tier + mirror_peer_auth_to_kernel write to a HyperMeshEbpf instance that never attaches XDP, while stoq's attached instance never receives validations (W2-93); kernel PoS-peer gating admits no authenticated peer live",
    "NGaugeTrustAdapter → TrustChain federation gating — TrustSignalProvider impl exists but is unmounted; peers admitted with no behavioral gating (W2-32)",
    "Service IPC relay (caesar/trustchain/ngauge/catalog subcommands) — 15 CLI-dispatched IPC methods are not registered by the daemon and return method-not-found on a running node (W2-75/W1-50); only local-crate stoq/ngauge core methods resolve",
    "message.* IPC handlers — send returns false 'created' with no wire send (receive-half only), inbox/history/read always empty against the live PeerContext MessageStore (W2-76)",
    "IPv6 asset addressing (AssetAddress) — type is shaped correctly but fully decorative on live paths (no consumer; shards keyed by bare BLAKE3 ContentHash) and its 4-bit shard nibble cannot encode adaptive RS counts up to 112 (W2-56)",
