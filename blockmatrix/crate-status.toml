[crate]
name = "Block-MATRIX"
id = "block-matrix"
description = "3D mesh topology, matrix-aware distributed computing, and asset pipeline"
phase = "alpha"

[features.working]
items = [
    # Matrix topology (real math, real data structures)
    "3D coordinate system (x,y,z positioning)",
    "Tensor math library (Vector3D, Matrix3x3, A*)",
    "Geospatial module (GPS conversion, clustering)",
    # Single-node blockchain (real persistence, real BLAKE3 hashing)
    "Every-node blockchain (independent Device chain, genesis on boot)",
    "Blockchain state persistence (WAL, snapshots, recovery via PersistenceManager)",
    "NodeBlockchain::from_blocks() chain reconstruction with integrity validation",
    "Node resume path (load persisted genesis/blocks/cert from disk)",
    "BLAKE3 content hashing for blocks",
    # Asset pipeline (real crypto, real erasure coding — LOCAL ONLY)
    "Asset pipeline: Compress(Brotli)->Encrypt(Kyber-1024 KEM)->Shard(Reed-Solomon 10+4)->store locally",
    "Adaptive erasure coding (R14 — RS parameters scale with asset size)",
    "Store command: file -> pipeline -> local shard files + shard map",
    "Fetch command: local shard files -> reverse pipeline -> reconstructed file",
    # Asset adapters (data structures and trait impls, no network validation)
    "Asset adapters (CPU/GPU/Memory/Storage/Network/Container) — struct definitions and local operations",
    "AssetRegistration with BLAKE3 content hash (stored in blocks as hash only, not full data)",
    "IPv6 asset addressing (AssetAddress: fd48:4d00 prefix, matrix coords, content fingerprint)",
    # Privacy model (real type system, maps to transport layer correctly)
    "Privacy allocation (PrivacyMode: Anonymous/Private/Public — transport layer selection)",
    "Privacy-aware certificate strategy (NetworkType selection based on PrivacyMode)",
    "Node bootstrap Anonymous/Private/Public certificate routing",
    # Bootstrap and DNS (real, local only)
    "Node bootstrap lifecycle (genesis block, self-signed cert, DNS init)",
    "Internal DNS service registration (5 services at boot, resolve_service())",
    "DNS CLI (register/resolve/list subcommands)",
    "DNS persistence across restarts (dns_records.json)",
    "DNS-as-asset blockchain registration (proper AssetRegistration with BaseSystemType::Dns)",
    # CLI and platform
    "CLI for matrix topology queries, node management, and asset operations",
    "Cross-platform OsAbstraction (Linux/macOS/BSD/Windows, hardware detection)",
    "Real hardware metrics collection (CPU/memory/network/storage from /proc)",
    "Capability-based GPU detection (honest fallback, no fake hardware)",
    # Naming and identity
    "StateAuthenticator trait (binary authentication interface)",
    "PeerIdentity bridges to lib NodeId",
    "Proof of State validation on block creation — add_block() requires StateProof, ValidationService validates before insert",
    "State proof hash anchored in block header (BLAKE3 of StateProof in every non-genesis block)",
    # Genesis and hardware (R1)
    "Genesis hardware assessment — OsAbstraction detects CPU/Memory/Storage/Network/GPU, registers as assets in block #1",
    # Peer handshake PoS
    "Peer handshake PoS token exchange — connect_to_peer()/accept_connections() generate+validate StateProof tokens",
    "STOQ integration PoS tokens — MatrixNodeAnnouncement carries real pos_token bytes",
    # Network sync (wired into node binary)
    "Cross-node block sync — SyncManager+ReflectorPool+BlockPropagator wired into node start, 5s sync loop",
    "Cross-node shard distribution — shards distributed to up to 6 nearest peers after pipeline store",
    "DNS block propagation — DNS blocks propagate via block sync to connected peers",
    "Network scope blockchain — reflector nodes join Network chain, TransportSyncDriver runs sync rounds",
    "Reflector pool block relay — ReflectorPool tracks peers, prunes stale, heartbeat in sync loop",
    "BLAKE3 shard integrity verification — incoming shards verified before storage",
    "StoqBlockTransportAdapter — real STOQ transport for block propagation (replaces SimulatedTransport)",
    # E2E verified (local ↔ trust.hypermesh.online)
    "Multi-node peer connections — E2E tested local ↔ GCP, bilateral PoS handshake verified",
    "Bootstrap sequence — self-signed cert + PoS handshake resolves cert/DNS/blockchain chicken-and-egg",
    # IPC daemon architecture (Phase 1 Sprints 1-2)
    "JSON-RPC 2.0 IPC over Unix domain sockets (protocol, server, client, handler)",
    "Daemon lifecycle (connect/disconnect commands, PID file, graceful shutdown)",
    "IPC handler dispatch (ping, shutdown, status methods)",
    "DaemonState shared context for IPC handlers",
    "Socket path 3-tier fallback ($HYPERMESH_SOCK > $XDG_RUNTIME_DIR > ~/.hypermesh)",
    # IPC command wiring (Phase 1 Sprint 3)
    "IPC handler modules (dns, blockchain, network, topology, asset, config)",
    "All CLI commands route through IPC when daemon is running",
    "Standalone fallback for store/fetch without daemon",
    "CliOutput Serialize support for JSON IPC responses",
    # Config system (Phase 1 Sprint 4)
    "TOML config file (~/.hypermesh/config.toml) with load/save/merge",
    "Config CLI (show/get/set/init subcommands)",
    "--json global flag for machine-parseable output",
    "--config global flag for custom config path",
    "CLI flags override config file values (CLI > config > defaults)",
    # Domains & Network Naming (Phase 2)
    "Domain-as-network — registering a domain creates a Network-scope blockchain (BLAKE3 chain ID)",
    "DomainRegistration struct with parent chain derivation and persistence",
    "Hierarchical DNS resolution — walks parent domain chains right-to-left",
    "DomainNetworkManager — bridges domain names to SyncManager network join/leave",
    "Domain invitation tokens — BLAKE3-HMAC keyed by owner proof, time-bounded",
    "Domain CLI (register, create, list, nodes, invite subcommands)",
    "Join command — join a domain network with optional invitation token",
    "Domain IPC handlers (domain.register, domain.list, domain.join)",
    # Dashboard system (Phase 3)
    "Dashboard manifest (dashboard.toml) with parse/validate, scope-aware access (public/private/admin)",
    "Dashboard CLI (deploy, list, info, init/scaffold)",
    "Dashboard IPC handlers (dashboard.list, dashboard.info)",
    "Default dashboard HTML (public welcome, private live metrics, admin controls)",
    "Dashboard scaffold generator — creates project structure with dashboard.toml and scope dirs",
    # Dashboard asset pipeline (deploy → register → serve)
    "Dashboard asset type (BaseSystemType::Dashboard, AssetType::Dashboard) — blockchain-registered",
    "Dashboard deploy pipeline — collect files, BLAKE3 hash, register as blockchain asset, persist to disk",
    "Dashboard IPC handlers (dashboard.deploy, dashboard.list, dashboard.info) — real data from disk",
    "HTTP API server ([::1]:9293) — 20 endpoints bridging HTTP to IPC for dashboard JS access",
    "Default dashboard auto-registration on first connect (public/private/admin HTML with live API calls)",
    "SDK-integrated default dashboards (public onboarding, private live metrics, admin controls)",
]

[features.in_development]
items = [
    # Remaining mesh networking gaps
    "Gossip protocol integration — GossipState struct exists, not producing real mesh coordination",
    "mDNS peer discovery — PeerAnnouncement struct exists, not tested multi-node",
    "Gateway cross-scope transfers — Lock/Transfer/Unlock lifecycle code exists, not integrated end-to-end",
]

[features.planned]
items = [
    "FALCON-1024 certificate generation (currently using rcgen X.509, not post-quantum)",
    "Real state proof generation (currently self-generated with hardcoded values)",
    "Bilateral verification between nodes (R11 — no global quorum, verify with counterparty directly)",
    "Swarm distribution protocol (R12 — announce/discover/serve with O(log N) scaling)",
    "Streaming shard reconstruction (R13 — incremental decode for min-spec devices)",
    "Privacy-scoped deduplication (R4 — full tracking Device/Private, hash-only Anonymous)",
    "Cross-network asset transfers with dual PoS validation",
    "Container runtime with real process isolation",
]
