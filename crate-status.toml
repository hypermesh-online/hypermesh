[crate]
name = "HyperMesh Repository"
id = "hypermesh"
description = "Cross-cutting repository-wide milestones and meta-tasks"
phase = "alpha"

[features.working]
items = [
    "Refactor / consolidation — removed Docker/Terraform/K8s/CloudFormation (system-level daemon model), fixed CI workflows, workspace lint config",
    "Documentation 100% correct — all 11 crate READMEs, ARCHITECTURE.md, root README accurate with correct stats, models, and IPv6 coverage",
    "Benchmarks — Criterion benchmarks for blockmatrix (5: phase1, retrieval, transfer, tensor, basic), stoq (3: throughput, real_throughput, ebpf), trustchain (certificates)",
    "Full development/contributions pipeline — CONTRIBUTING.md, SECURITY.md, CHANGELOG.md, pre-commit hooks, PR workflow documented",
    "Bug tracking/reporting — GitHub issue templates (bug report, feature request), severity labels, security disclosure via SECURITY.md",
    "Cross-crate integration tests — 33 compile-time tests in cross_crate_integration.rs + 17 integration tests (asset_pipeline, blockchain_scope, privacy_consistency)",
    "Unified cross-crate identity model (NodeId BLAKE3([u8;32]), ScopedIdentity, WorkloadType — all crates use lib canonical types)",
    "Scope-aware identity system (IdentityScope respects Device|Network scope + traceability axis, cert extensions, strategy scoping)",
    "Certificate lifecycle per scope (Anonymous=ephemeral minutes, Private=bounded days, Public=full months — trustchain + stoq)",
    "5 language SDKs (TypeScript, Python, C#, C++, Go) — HTTP REST + FFI dual-path, per-service modules, examples, guides",
    "C FFI bindings (hypermesh-ffi) — 38 functions covering all APIs, 5 language FFI loaders",
    "CLI service subcommands (hypermesh caesar/trustchain/engauge/catalog) with IPC relay",
]

[features.in_development]
items = [
    "Live alpha deployment — trust.hypermesh.online first public node (gateway + trustchain CA/DNS/CT + blockmatrix reflector)",
    "Network MVP — bilateral handshake exists but is in WRONG LAYER (blockmatrix instead of STOQ), identity binding fixed but handshake not functional yet due to Stream::send() closing write half (needs multi-message framing). Block sync infrastructure wired but depends on working handshake. PoS validation is now real (FALCON-1024 WireSignedProof envelope in BlockMatrix). Metrics emission to engauge wired (UDP capacity frames).",
    "Handshake/identity layer migration — FalconIdentity, bilateral handshake, and PoS exchange must move from blockmatrix to STOQ/TrustChain (transport-layer concerns in blockchain crate)",
]

[features.planned]
items = [
    "Modular restructure for polyrepo/microservice — extract crates into independent repos with CI, versioned APIs, and publish pipeline",
    "Development documentation live sync — auto-generate and publish docs from source (rustdoc, typedoc) on every merge",
    "Website linking restructure to polyrepo and live docs — update hypermesh.online to link per-repo docs, changelogs, and dashboards",
    "Usability testing — real-user testing of CLI, dashboard, and asset workflows with feedback collection and iteration",
    "Remove all hardcoded performance stubs (tests/performance.rs, tests/validation.rs, tests/chaos.rs)",
    "Real partition/chaos testing framework",
]
