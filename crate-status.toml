[crate]
name = "HyperMesh Repository"
id = "hypermesh"
description = "Cross-cutting repository-wide milestones and meta-tasks"
phase = "alpha"

[features.working]
items = [
    "Refactor / consolidation — removed Docker/Terraform/K8s/CloudFormation (system-level daemon model), fixed CI workflows, workspace lint config",
    "Documentation 100% correct — all 11 crate READMEs, ARCHITECTURE.md, root README accurate with correct stats, models, and IPv6 coverage",
    "Benchmarks — Criterion benchmarks for blockmatrix (5: phase1, retrieval, transfer, tensor, basic), stoq (3: throughput, real_throughput, ebpf), trustchain (certificates)",
    "Full development/contributions pipeline — CONTRIBUTING.md, SECURITY.md, CHANGELOG.md, pre-commit hooks, PR workflow documented",
    "Bug tracking/reporting — GitHub issue templates (bug report, feature request), severity labels, security disclosure via SECURITY.md",
    "Cross-crate integration tests — 33 compile-time tests in cross_crate_integration.rs + 17 integration tests (asset_pipeline, blockchain_scope, privacy_consistency)",
    "Unified cross-crate identity model (NodeId BLAKE3([u8;32]), ScopedIdentity, WorkloadType — all crates use lib canonical types)",
    "Scope-aware identity system (IdentityScope respects Device|Network scope + traceability axis, cert extensions, strategy scoping)",
    "Certificate lifecycle per scope (Anonymous=ephemeral minutes, Private=bounded days, Public=full months — trustchain + stoq)",
    "5 language SDKs (TypeScript, Python, C#, C++, Go) — HTTP REST + FFI dual-path, per-service modules, examples, guides",
    "C FFI bindings (hypermesh-ffi) — 38 functions covering all APIs, 5 language FFI loaders",
    "CLI service subcommands (hypermesh caesar/trustchain/ngauge/catalog) with IPC relay",
    "Shard architecture — disk persistence, auth TTL, peer cleanup on disconnect, PoS-gated access control; kernel+userspace policy unified and shard fetch is PoS-authenticated (eBPF kernel gate)",
    "Workspace version unification — [workspace.package] version = 1.0.0, all 13 members inherit version.workspace (P7 fixed the prior ngauge/caesar 1.0.0-vs-0.1.0 skew)",
    "One-click installer — scripts/install/hypermesh-install.sh (P7)",
    "S1 Proof of State consolidation — ONE canonical PoS type set in lib (StakeProof/WorkProof/SpaceProof/TimeProof/StateProof/WireSignedProof + Owner/GrantScope/AuthorizationSet/AuthDecision/CapacityProfile); trustchain re-exports and keeps generation/crypto via a StateProofOps extension trait; stoq + catalog consume lib's set; 7 duplicate PoS type sets removed across trustchain/stoq/blockmatrix/caesar/catalog",
    "S1 stake-magnitude → authorization — every magnitude gate deleted workspace-wide (stake_amount, minimum_stake, MAX_REASONABLE_STORAGE, PoW leading-zero difficulty + nonce including hypermesh_xdp.c, capacity admission gates); PoStake is WHO, PoWork is a work_hash, PoSpace capacity is descriptive and never gates",
    "S1 fixed the `--features multi-node` build (was E0072 recursive-type on main)",
    "PoS magnitude guard — scripts/check-no-pos-magnitude.sh scans the whole worktree by behaviour/shape (not identifier, not limited to src/) and blocks on pre-push",
    "VISION.md — architecture of record (Node ≡ Asset ≡ Index, one chain per asset, nodes as mirrors/validators/distributors/seeds, genesis defined as SystemAssets)",
    "Adversarial Consensus Simulation (Tier 1) — tests/adversarial_simulation.rs executing live bilateral FALCON-1024 verification, graft rejection, proof tampering rejection, signed-to-content replay attack rejection, storage/registration metadata tampering rejection (W1-0), and 10-node Byzantine containment",
    "W1-0 Received-Block & Asset-Chain Metadata Cryptographic Envelope — full cryptographic binding of storage_pointer and registration to entry_commitment() in calculate_hash, compute_entries_hash, and FALCON envelope on the received-block validation path",
    "W1-4 Deterministic Binary Serialization for StateProof — 100% migration from non-canonical serde_json::to_vec proof hashing to canonical bincode StateProof::to_bytes() across the entire workspace",
    "Purged all mock performance and chaos stubs — tests/performance.rs, tests/validation.rs, and tests/chaos.rs completely upgraded with live cryptographic benchmarks, real async channels, memory stress, and multi-node Byzantine simulations",
    "NIST PQC Precision & 4D Proof of State Formalization — papers/HYPERMESH.md updated with August 2024 FIPS 203/204/205 status, draft FIPS 206 (FALCON), Hybrid Post-Quantum AEAD storage encryption (ML-KEM-1024 -> HKDF -> AES-256-GCM), and 4D RWA State Verification Matrix",
]

[features.in_development]
items = [
    "Live alpha deployment — trust.hypermesh.online first public node (gateway + trustchain CA/DNS/CT + blockmatrix reflector); dual-CA split (http3:8444 / stoq:8445) deployed and verified live (F9)",
    "Network MVP — bilateral handshake + block sync verified E2E local-to-GCP (trust.hypermesh.online), network_id metadata exchange, runtime block propagation, cross-genesis sync, real FALCON-1024 PoS, PoS-gated access control, shard distribution, stale cert auto-recovery.",
    "First-Class Sovereign Asset-Chain Unification — AssetLineage, AssetChainIndex, and HyperMeshAssetRecord unification where every asset maintains its own sovereign cryptographic chain and nodes serve as mirrors/validators/seeds",
    "Network Genesis Adoption Protocol — implement adopt_genesis flow in blockmatrix/src/blockchain/chain.rs and sync_manager.rs so joining nodes adopt network genesis SystemAssets without graft rejections",
    "Mirror/sharding architecture correction (A-series) — Reed-Solomon sharding moved into NGauge, two-layer mirror retrieval + upstream tracker, per-shard mirror invariant on live paths, on-chain shard registration at publish + interest-scoped registration on fetch, 3-node mirror flow proven E2E",
    "Handshake/identity layer migration — FalconIdentity, bilateral handshake, and PoS exchange moving to STOQ/TrustChain transport layer",
]

[features.planned]
items = [
    "Modular restructure for polyrepo/microservice — extract crates into independent repos with CI, versioned APIs, and publish pipeline",
    "Development documentation live sync — auto-generate and publish docs from source (rustdoc, typedoc) on every merge",
    "Website linking restructure to polyrepo and live docs — update hypermesh.online to link per-repo docs, changelogs, and dashboards",
    "Usability testing — real-user testing of CLI, dashboard, and asset workflows with feedback collection and iteration",
    "Multi-Scale Adversarial Simulation Harness (Tier 2 & 3: 100 to 10,000 nodes)",
]
