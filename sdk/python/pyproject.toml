[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypermesh-sdk"
version = "0.1.0"
description = "Python SDK for the HyperMesh node HTTP REST API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["hypermesh", "blockchain", "mesh", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
async = ["httpx>=0.25"]

[project.urls]
Homepage = "https://github.com/hypermesh-online/hypermesh"
Repository = "https://github.com/hypermesh-online/hypermesh"

[tool.setuptools.packages.find]
include = ["hypermesh*"]
